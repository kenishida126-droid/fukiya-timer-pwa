<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>吹矢Timer TEST</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    background-color: #000;
    background-image: url('@wallpaper.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #fff;
    font-family: sans-serif;
    text-align: center;

    -webkit-user-select: none;
    user-select: none;
  }

  .container {
    width: 90%;
    max-width: 600px;
    margin: 0 auto;
    padding: 8vh 0 6vh 0;
  }

  .date {
    font-size: 2.0em;
    font-weight: bold;
    text-shadow:
      2px 2px 4px #000,
      -1px -1px 2px #000;
    margin-bottom: 1.0em;
  }

  .message {
    font-size: 1.18em;
    line-height: 2.0;
    font-weight: bold;

    text-shadow:
      2px 2px 5px #000,
      -1px -1px 3px #000;

    margin-bottom: 2.0em;
  }

  .button {
    display: block;

    width: 80%;
    max-width: 360px;

    margin: 1.0em auto;
    padding: 0.8em 1em;

    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 10px;

    background: rgba(0,0,0,0.45);
    color: #fff;

    font-size: 1.3em;
    font-weight: bold;

    text-shadow: 1px 1px 3px #000;

    cursor: pointer;

    transition: background 0.2s ease,
                transform 0.1s ease;

    -webkit-tap-highlight-color: transparent;
  }

  .button:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.20);
  }

  #videoArea {
    display: none;
    width: 90%;
    max-width: 560px;
    margin: 1.5em auto;
  }

  #relaxVideo {
    width: 100%;
    height: auto;
    max-height: 60vh;

    border-radius: 10px;

    box-shadow:
      0 0 15px rgba(0,0,0,0.8);

    background: #000;
  }
</style>
</head>

<body>

<div class="container">

  <!-- 日付はJavaScriptで自動表示 -->
  <div class="date" id="date"></div>

  <div class="message">
    開発中/修正中の案件はございません<br>
    折角いらしてくださったのですから<br>
    どうぞ、ごゆっくりお過ごしください
  </div>

  <!-- 癒やしの音楽 -->
  <button class="button" id="musicButton">
    癒やしの音楽<br>
    ♪「OtoLogic」より ♫
  </button>

  <!-- 癒やしの動画 -->
  <button class="button" id="videoButton">
    癒やしの動画
  </button>

  <!-- 動画表示エリア -->
  <div id="videoArea">
    <video id="relaxVideo"
           src="@video.mp4"
           playsinline
           preload="metadata">
    </video>
  </div>

  <!-- 戻る -->
  <button class="button" id="backButton">
    戻る
  </button>

</div>

<!-- 音楽 -->
<audio id="relaxMusic"
       src="@music.mp3"
       preload="metadata">
</audio>

<script>

/* ========================================
   日付表示
   ======================================== */

const now = new Date();

const year = now.getFullYear();
const month = String(now.getMonth() + 1).padStart(2, '0');
const day = String(now.getDate()).padStart(2, '0');

document.getElementById('date').textContent =
  `${year}年${month}月${day}日現在`;


/* ========================================
   癒やしの音楽
   ======================================== */

const music = document.getElementById('relaxMusic');
const musicButton = document.getElementById('musicButton');

musicButton.addEventListener('click', async function() {

  if (music.paused) {

    try {
      await music.play();
      musicButton.textContent = '音楽停止';

    } catch (error) {
      console.log('音楽を再生できませんでした:', error);
    }

  } else {

    music.pause();
    music.currentTime = 0;
    musicButton.textContent = '癒やしの音楽';

  }
});


/* 音楽終了時 */
music.addEventListener('ended', function() {
  musicButton.textContent = '癒やしの音楽';
});


/* ========================================
   癒やしの動画
   ======================================== */

const video = document.getElementById('relaxVideo');
const videoButton = document.getElementById('videoButton');
const videoArea = document.getElementById('videoArea');

videoButton.addEventListener('click', async function() {

  if (video.paused) {

    videoArea.style.display = 'block';

    try {
      await video.play();
      videoButton.textContent = '動画停止';

    } catch (error) {
      console.log('動画を再生できませんでした:', error);
    }

  } else {

    video.pause();
    video.currentTime = 0;
    videoArea.style.display = 'none';
    videoButton.textContent = '癒やしの動画';

  }
});


/* 動画終了時 */
video.addEventListener('ended', function() {
  videoButton.textContent = '癒やしの動画';
  videoArea.style.display = 'none';
});


/* ========================================
   戻る
   ======================================== */

document.getElementById('backButton').addEventListener('click', function() {
  history.back();
});

</script>

</body>
</html>
