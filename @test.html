<script>


/* ========================================
   設定
   ======================================== */


/*
   音楽ファイル数

   起動時に
   @music-1.mp3
   @music-2.mp3
   …
   と順番に自動検出する。

   ファイルを追加した場合は、
   数字を変更する必要はない。
*/

let musicCount = 0;
let musicFilesFound = new Set();

/*
   音楽ファイルの対応拡張子

   @music-xx.* をブラウザから直接列挙することはできないため、
   主要な音声拡張子を順番に確認する。

   優先順位は、従来のMP3動作を維持するためMP3を先頭にする。
   同じ番号に複数形式が存在する場合は、この順で最初に見つかった
   ファイルを再生する。
*/
const musicExtensions = [
  'mp3',
  'flac',
  'm4a',
  'aac',
  'ogg',
  'oga',
  'opus',
  'wav',
  'webm'
];

/* Music-xx → 実際に検出したファイル */
let musicFileMap = new Map();

/* GitHub専用：GitHubの実ファイル管理はLocal/Extraと完全分離する */
const githubMusicFileMap = new Map();

/*
   音楽ファイル数の検出完了フラグ
   検出中はプルダウンを表示しない。
*/
let musicReady = false;


/*
   壁紙ファイル数

   現在は

   @wallpaper-1.jpg
   @wallpaper-2.jpg
   @wallpaper-3.jpg

   の3枚。
*/

const wallpaperCount = 3;


/*
   Long-tap判定時間
*/

const longTapTime = 600;


/* ========================================
   日付表示
   ======================================== */

const now = new Date();

const year =
  now.getFullYear();

const month =
  String(now.getMonth() + 1)
    .padStart(2, '0');

const day =
  String(now.getDate())
    .padStart(2, '0');

document.getElementById('date').textContent =
  `${year}年${month}月${day}日現在`;


/* ========================================
   音楽
   ======================================== */

const music =
  document.getElementById('relaxMusic');


/* ========================================
   音楽再生中のSleep制御

   音楽が「実際に再生中」の間だけWake Lockを取得する。
   Pause／終了／停止状態ではWake Lockを解除し、
   端末設定どおりの通常Sleepを許可する。

   ※動画再生時はWake Lockを使用しない。
   ======================================== */
let musicWakeLock = null;

async function requestMusicWakeLock() {

  if (!('wakeLock' in navigator)) return;

  try {

    if (musicWakeLock) return;

    musicWakeLock =
      await navigator.wakeLock.request('screen');

    musicWakeLock.addEventListener(
      'release',
      function() {
        musicWakeLock = null;
      }
    );

  } catch (error) {

    console.log(
      'Wake Lockを取得できませんでした:',
      error
    );

  }
}

async function releaseMusicWakeLock() {

  if (!musicWakeLock) return;

  try {
    await musicWakeLock.release();
  } catch (error) {
    console.log(
      'Wake Lock解除に失敗しました:',
      error
    );
  }

  musicWakeLock = null;
}

/* 音楽が再生開始した時だけSleep OFF */
music.addEventListener(
  'play',
  function() {
    requestMusicWakeLock();
  }
);

/* Pauseしたら通常Sleepへ戻す */
music.addEventListener(
  'pause',
  function() {
    releaseMusicWakeLock();
  }
);

/* 終了したら通常Sleepへ戻す */
music.addEventListener(
  'ended',
  function() {
    releaseMusicWakeLock();
  }
);

/*
   画面再表示時、音楽がまだ実際に再生中なら
   Wake Lockを再取得する。
*/
document.addEventListener(
  'visibilitychange',
  function() {

    if (
      document.visibilityState === 'visible' &&
      !music.paused &&
      !music.ended
    ) {
      requestMusicWakeLock();
    }

  }
);

const musicButton =
  document.getElementById('musicButton');

const musicHint =
  document.getElementById('musicHint');

const musicMenu =
  document.getElementById('musicMenu');

const musicControl =
  document.getElementById('musicControl');


/* ========================================
   Ver.11 音楽再生元
   ======================================== */
const musicSourceSelector =
  document.getElementById('musicSourceSelector');

const folderPickerDialog =
  document.getElementById('folderPickerDialog');

const folderPickerMessage =
  document.getElementById('folderPickerMessage');

const folderPickerGo =
  document.getElementById('folderPickerGo');

const folderPickerCancel =
  document.getElementById('folderPickerCancel');

let musicSource = 'github';

/*
   音楽ソースごとの前回再生曲
   GitHub / Local / External を切り替えても、
   それぞれ最後に再生していた曲から再開する。
*/
const currentMusicBySource = {
  github: 1,
  local: 1,
  extra: 1
};

/* 起動時から各ソースの前回再生曲を復元する。
   未記録の場合だけMusic-1を初期値とする。 */
currentMusicBySource.github = getSavedMusicForSource('github');
currentMusicBySource.local  = getSavedMusicForSource('local');
currentMusicBySource.extra  = getSavedMusicForSource('extra');

function getSavedMusicForSource(source) {
  const key = `fukiyaTestLastMusic_${source}`;
  const saved = Number(localStorage.getItem(key));

  if (Number.isInteger(saved) && saved >= 1) {
    return saved;
  }

  return 1;
}

/* Local / Extraで選択したフォルダー */
const sourceDirectoryHandles = {
  local: null,
  extra: null
};

/* 開発用IndexedDB初期化ボタンの安全制御。
   フォルダー走査中は無効化し、走査とDB削除を競合させない。 */
let musicScanInProgress = 0;

function updateIndexedDBResetButtonState() {
  const button = document.getElementById('indexedDBResetButton');
  if (!button) return;
  button.disabled = musicScanInProgress > 0;
}

/* ========================================
   Ver.11 Local / External フォルダー記憶
   Local と Extra の選択フォルダーを別々に記憶する。
   ブラウザを閉じても次回起動時に前回のフォルダーを
   選択開始位置として使用できるよう IndexedDB に保存する。
   ======================================== */
const directoryHandleDBName = 'fukiya-test-directory-handles';
const directoryHandleStoreName = 'handles';

/*
   Local / External の音楽索引Table。
   File / Blob / Object URL はIndexedDBへ保存しない。
*/
const localMusicTableStoreName = 'localTable';
const externalMusicTableStoreName = 'externalTable';

function getMusicTableStoreName(source) {
  return source === 'extra'
    ? externalMusicTableStoreName
    : localMusicTableStoreName;
}

function openDirectoryHandleDB() {
  return new Promise(function(resolve, reject) {
    const request = indexedDB.open(directoryHandleDBName, 3);

    request.onupgradeneeded = function() {
      const db = request.result;

      if (!db.objectStoreNames.contains(directoryHandleStoreName)) {
        db.createObjectStore(directoryHandleStoreName);
      }

      if (!db.objectStoreNames.contains(localMusicTableStoreName)) {
        db.createObjectStore(localMusicTableStoreName, { keyPath: 'key' });
      }

      if (!db.objectStoreNames.contains(externalMusicTableStoreName)) {
        db.createObjectStore(externalMusicTableStoreName, { keyPath: 'key' });
      }

      /* 旧Ver.の「音楽File保存用Store」は廃止する。 */
      if (db.objectStoreNames.contains('musicCaches')) {
        db.deleteObjectStore('musicCaches');
      }
    };

    request.onsuccess = function() {
      resolve(request.result);
    };

    request.onerror = function() {
      reject(request.error);
    };
  });
}

async function saveDirectoryHandle(source, handle) {
  try {
    const db = await openDirectoryHandleDB();
    await new Promise(function(resolve, reject) {
      const tx = db.transaction(directoryHandleStoreName, 'readwrite');
      tx.objectStore(directoryHandleStoreName).put(handle, source);
      tx.oncomplete = resolve;
      tx.onerror = function() { reject(tx.error); };
    });
    db.close();
  } catch (error) {
    console.log('フォルダー記憶を保存できませんでした:', error);
  }
}

async function restoreDirectoryHandles() {
  try {
    const db = await openDirectoryHandleDB();

    await new Promise(function(resolve, reject) {
      const tx = db.transaction(directoryHandleStoreName, 'readonly');
      const store = tx.objectStore(directoryHandleStoreName);

      ['local', 'extra'].forEach(function(source) {
        const request = store.get(source);
        request.onsuccess = function() {
          if (request.result) {
            sourceDirectoryHandles[source] = request.result;
          }
        };
      });

      tx.oncomplete = resolve;
      tx.onerror = function() { reject(tx.error); };
    });

    db.close();
  } catch (error) {
    console.log('前回のフォルダー記憶を読み込めませんでした:', error);
  }
}

const directoryHandlesRestorePromise = restoreDirectoryHandles();

/* ========================================
   Local / External 音楽索引Table

   Tableには「どこに何があるか」だけを保存する。
   実際のFile / Blobは保存しない。
   ======================================== */

const sourceMusicTables = {
  local: null,
  extra: null
};

/* 既存UIのsourceMusicCaches参照は、永続Table状態をそのまま利用する。 */
const sourceMusicCaches = sourceMusicTables;

function compareMusicPath(a, b) {
  return String(a).localeCompare(String(b), 'ja', {
    numeric: true,
    sensitivity: 'base'
  });
}

function sortScanQueue(queue) {
  queue.sort(function(a, b) {
    return compareMusicPath(a.path, b.path);
  });
}

function getFolderKeyFromPath(path) {
  const parts = String(path).split('/').filter(Boolean);
  return parts.length > 1 ? parts[0] : '__ROOT__';
}

function getFolderCode(meta, folderKey) {
  if (!meta.folderCodes) meta.folderCodes = {};

  if (!meta.folderCodes[folderKey]) {
    const used = new Set(Object.values(meta.folderCodes));
    let code = '';
    for (let i = 0; i < 26; i++) {
      const candidate = String.fromCharCode(65 + i);
      if (!used.has(candidate)) {
        code = candidate;
        break;
      }
    }
    if (!code) {
      code = `F${Object.keys(meta.folderCodes).length + 1}`;
    }
    meta.folderCodes[folderKey] = code;
  }

  return meta.folderCodes[folderKey];
}

function getDisplayMusicId(record) {
  if (!record) return '';
  return record.displayId || `Music-${record.folderCode || 'A'}-${String(record.folderMusicNumber || record.number).padStart(2, '0')}`;
}

async function getMusicTableMeta(source) {
  const storeName = getMusicTableStoreName(source);
  const db = await openDirectoryHandleDB();

  const meta = await new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const request = tx.objectStore(storeName).get('__meta__');
    request.onsuccess = function() { resolve(request.result || null); };
    request.onerror = function() { reject(request.error); };
  });

  db.close();
  return meta;
}

async function saveMusicTableMeta(source, meta) {
  const storeName = getMusicTableStoreName(source);
  const db = await openDirectoryHandleDB();

  await new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(meta);
    tx.oncomplete = resolve;
    tx.onerror = function() { reject(tx.error); };
  });

  db.close();
}

async function loadMusicTableRecords(source) {
  const storeName = getMusicTableStoreName(source);
  const db = await openDirectoryHandleDB();

  const records = await new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const request = tx.objectStore(storeName).getAll();
    request.onsuccess = function() { resolve(request.result || []); };
    request.onerror = function() { reject(request.error); };
  });

  db.close();
  return records;
}

async function restoreMusicTable(source) {
  if (source !== 'local' && source !== 'extra') return null;

  try {
    await directoryHandlesRestorePromise;
    const records = await loadMusicTableRecords(source);
    const meta = records.find(function(item) {
      return item && item.key === '__meta__';
    });

    if (!meta) return null;

    const musicRecords = records
      .filter(function(item) {
        return item && item.type === 'music';
      })
      .sort(function(a, b) {
        return a.number - b.number;
      });

    sourceMusicTables[source] = {
      meta: meta,
      records: new Map(musicRecords.map(function(item) {
        return [item.number, item];
      })),
      ready: musicRecords.length > 0 || meta.completed === true
    };

    return sourceMusicTables[source];

  } catch (error) {
    console.log(`${source} の音楽索引Tableを復元できませんでした:`, error);
    return null;
  }
}

async function initializeMusicTable(source, directoryHandle) {
  const existing = await getMusicTableMeta(source);

  if (existing && existing.folderName === (directoryHandle.name || '')) {
    /* 既存Tableを再利用する。recordsも同時にメモリへ復元する。 */
    await restoreMusicTable(source);
    return existing;
  }

  /* 新しいフォルダーを選択した場合は、そのソースのTableだけを作り直す。 */
  await deleteMusicTableFromDB(source);

  const meta = {
    key: '__meta__',
    type: 'meta',
    folderName: directoryHandle.name || '',
    completed: false,
    nextMusicNumber: 1,
    pendingEntries: [
      { kind: 'directory', path: '' }
    ],
    folderCodes: {},
    folderSongCounts: {},
    updatedAt: Date.now()
  };

  await saveMusicTableMeta(source, meta);

  sourceMusicTables[source] = {
    meta: meta,
    records: new Map(),
    ready: false
  };

  return meta;
}

async function deleteMusicTableFromDB(source) {
  if (source !== 'local' && source !== 'extra') return;

  const storeName = getMusicTableStoreName(source);
  const db = await openDirectoryHandleDB();

  await new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = resolve;
    tx.onerror = function() { reject(tx.error); };
  });

  db.close();
  sourceMusicTables[source] = null;
}

async function resolveDirectoryHandleByPath(rootHandle, relativePath) {
  let handle = rootHandle;
  const parts = String(relativePath || '')
    .split('/')
    .filter(Boolean);

  for (const part of parts) {
    handle = await handle.getDirectoryHandle(part);
  }

  return handle;
}

async function getFileFromMusicPath(rootHandle, relativePath) {
  const parts = String(relativePath || '')
    .split('/')
    .filter(Boolean);

  if (parts.length === 0) return null;

  const fileName = parts.pop();
  const parentPath = parts.join('/');
  const parentHandle = await resolveDirectoryHandleByPath(
    rootHandle,
    parentPath
  );

  const fileHandle = await parentHandle.getFileHandle(fileName);
  return await fileHandle.getFile();
}

async function saveMusicRecordAndMeta(source, record, meta) {
  const storeName = getMusicTableStoreName(source);
  const db = await openDirectoryHandleDB();

  await new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(record);
    store.put(meta);
    tx.oncomplete = resolve;
    tx.onerror = function() { reject(tx.error); };
  });

  db.close();
}

async function enumerateDirectoryIntoQueue(directoryHandle, directoryPath, meta) {
  const entries = [];

  for await (const entry of directoryHandle.values()) {
    const childPath = directoryPath
      ? `${directoryPath}/${entry.name}`
      : entry.name;

    if (entry.kind === 'directory') {
      entries.push({
        kind: 'directory',
        path: childPath
      });
    }
    else if (entry.kind === 'file' && isSupportedLocalMusicFileName(entry.name)) {
      entries.push({
        kind: 'file',
        path: childPath
      });
    }
  }

  meta.pendingEntries = meta.pendingEntries.concat(entries);
  sortScanQueue(meta.pendingEntries);
}

function isSupportedLocalMusicFileName(name) {
  const dot = String(name || '').lastIndexOf('.');
  if (dot < 0) return false;

  const extension =
    String(name).slice(dot + 1).toLowerCase();

  return musicExtensions.includes(extension);
}

/*
   Local / Externalの永続スキャン。

   ・Tableがcompletedなら再走査しない。
   ・未完了ならpendingEntriesの先頭から再開する。
   ・音楽File本体はTableへ保存しない。
   ・1曲処理するたびにTableへcheckpointする。
*/
async function scanMusicTableInBackground(source, directoryHandle) {
  if (source !== 'local' && source !== 'extra') return false;
  if (!directoryHandle) return false;

  const state = sourceMusicTables[source];
  if (state && state.meta && state.meta.completed) {
    return true;
  }

  if (state && state.scanning) {
    return state.scanning;
  }

  const scanPromise = (async function() {
    musicScanInProgress++;
    updateIndexedDBResetButtonState();

    try {
      let meta = await initializeMusicTable(source, directoryHandle);
      let table = sourceMusicTables[source];

      while (meta.pendingEntries && meta.pendingEntries.length > 0) {
        const item = meta.pendingEntries.shift();

        if (item.kind === 'directory') {
          const dirHandle = await resolveDirectoryHandleByPath(
            directoryHandle,
            item.path
          );

          await enumerateDirectoryIntoQueue(
            dirHandle,
            item.path,
            meta
          );

          meta.updatedAt = Date.now();
          await saveMusicTableMeta(source, meta);
          continue;
        }

        if (item.kind !== 'file') continue;

        try {
          const file = await getFileFromMusicPath(
            directoryHandle,
            item.path
          );

          if (!file || !isSupportedLocalMusicFile(file)) {
            continue;
          }

          const number = meta.nextMusicNumber++;
          const folderKey = getFolderKeyFromPath(item.path);
          const folderCode = getFolderCode(meta, folderKey);
          const folderMusicNumber =
            (meta.folderSongCounts[folderKey] || 0) + 1;

          meta.folderSongCounts[folderKey] = folderMusicNumber;

          const record = {
            key: `music-${number}`,
            type: 'music',
            number: number,
            displayId: `Music-${folderCode}-${String(folderMusicNumber).padStart(2, '0')}`,
            folderCode: folderCode,
            folderKey: folderKey,
            folderMusicNumber: folderMusicNumber,
            path: item.path,
            fileName: file.name,
            extension: String(file.name).split('.').pop().toLowerCase()
          };

          table.records.set(number, record);
          table.ready = true;

          await saveMusicRecordAndMeta(source, record, meta);

          /* 連続したFile取得でUIを固めない。 */
          await new Promise(function(resolve) {
            setTimeout(resolve, 0);
          });

        } catch (error) {
          console.log(`${source} の音楽ファイル走査をスキップしました:`, item.path, error);
        }
      }

      meta.completed = true;
      meta.updatedAt = Date.now();
      await saveMusicTableMeta(source, meta);

      table.ready = true;
      return true;

    } catch (error) {
      console.log(`${source} の音楽索引Table走査を中断しました:`, error);
      return false;

    } finally {
      musicScanInProgress--;
      updateIndexedDBResetButtonState();
    }
  })();

  sourceMusicTables[source] = sourceMusicTables[source] || {
    meta: null,
    records: new Map(),
    ready: false
  };
  sourceMusicTables[source].scanning = scanPromise;

  try {
    return await scanPromise;
  } finally {
    if (sourceMusicTables[source]) {
      sourceMusicTables[source].scanning = null;
    }
  }
}

function buildSourceMusicStateFromTable(source) {
  const table = sourceMusicTables[source];
  if (!table) return false;

  musicFileMap = new Map();
  musicFilesFound = new Set();
  musicCount = 0;
  musicReady = false;
  localMusicFileEntries = [];
  localMusicFiles = [];

  table.records.forEach(function(record, number) {
    musicFilesFound.add(number);
    musicCount = Math.max(musicCount, number);
    localMusicFileEntries.push({
      number: number,
      path: record.path,
      displayId: record.displayId,
      fileName: record.fileName,
      extension: record.extension
    });
  });

  localMusicFileEntries.sort(function(a, b) {
    return a.number - b.number;
  });

  musicReady = musicFilesFound.size > 0;
  selectedMusicFolderName = table.meta
    ? (table.meta.folderName || '')
    : '';

  /* 既存のUI/再生制御が参照する互換プロパティ。File本体は持たない。 */
  table.filesFound = new Set(musicFilesFound);
  table.count = musicCount;
  table.ready = musicReady || !!(table.meta && table.meta.completed);
  table.folderName = selectedMusicFolderName;

  if (musicReady) {
    createMusicMenu();
  }

  return musicReady;
}

/*
   Local / Externalを再走査せず、Tableから現在の索引を復元する。
*/
async function prepareLocalMusicSourceFromTable(source) {
  const table = await restoreMusicTable(source);
  if (!table) return false;

  return buildSourceMusicStateFromTable(source);
}

/* 現在のソースを切替える。実ファイルは必要になった時だけ取得する。 */
function activateLocalMusicCache(source) {
  if (source !== 'local' && source !== 'extra') return false;

  const table = sourceMusicTables[source];
  if (!table) return false;

  const ready = buildSourceMusicStateFromTable(source);
  return ready;
}

function discardLocalMusicCache(source) {
  if (source !== 'local' && source !== 'extra') return;
  sourceMusicTables[source] = null;
}

function clearActiveLocalMusicState() {
  musicFileMap.forEach(function(url) {
    try { URL.revokeObjectURL(url); } catch (error) {}
  });

  musicFileMap = new Map();
  musicFilesFound = new Set();
  localMusicObjectUrls = [];
  localMusicFiles = [];
  localMusicFileEntries = [];
  musicCount = 0;
  musicReady = false;
  selectedMusicFolderName = '';
  getMusicTitleCache(musicSource).clear();
}

function getSelectedMusicSource() {
  const checked =
    musicSourceSelector.querySelector('input[name="musicSource"]:checked');

  return checked ? checked.value : 'github';
}

function sourceLabel(source) {
  if (source === 'local') return 'Local（内部メモリ）';
  if (source === 'extra') return 'External（外部メモリ）';
  return 'GitHub';
}

let folderPickerSource = null;

function showFolderPickerDialog(source) {
  folderPickerSource = source;

  folderPickerMessage.innerHTML =
    `${sourceLabel(source)}内のフォルダー一覧を表示します<br>` +
    `音楽フォルダーを選択してください` +
    (source === 'extra' ? `<br><small>※SDカードを使用する場合は、表示されたファイル選択画面でSDカード側へ移動してください</small>` : '');

  folderPickerDialog.style.display = 'flex';
}

function hideFolderPickerDialog() {
  folderPickerDialog.style.display = 'none';
}

function releaseLocalMusicObjectUrls() {
  localMusicObjectUrls.forEach(function(url) {
    try {
      URL.revokeObjectURL(url);
    } catch (error) {}
  });

  localMusicObjectUrls = [];
  localMusicFiles = [];
}

function isSupportedLocalMusicFile(file) {
  return isSupportedLocalMusicFileName(file && file.name);
}

/*
   Tableから必要な1曲だけ実Fileを取得し、Object URLを作る。
   IndexedDBにはFile自体を保存しない。
*/
async function getPlayableLocalMusicFile(number) {
  if (musicSource === 'github') return '';

  if (musicFileMap.has(number)) {
    return musicFileMap.get(number);
  }

  const table = sourceMusicTables[musicSource];
  const handle = sourceDirectoryHandles[musicSource];

  if (!table || !handle) return '';

  const record = table.records.get(number);
  if (!record) return '';

  try {
    const file = await getFileFromMusicPath(handle, record.path);
    if (!file) return '';

    const url = URL.createObjectURL(file);
    musicFileMap.set(number, url);
    localMusicObjectUrls.push(url);
    return url;

  } catch (error) {
    console.log(`${getDisplayMusicId(record)} の実ファイル取得に失敗しました:`, error);
    return '';
  }
}

/*
   Local / External Tableを読み込み、未完了ならバックグラウンドで再開する。
*/
const sourcePreparationPromises = {
  local: null,
  extra: null
};

/* 旧コードとの接続用。実体はFileキャッシュではなくTable復元完了を待つ。 */
const musicTablesRestorePromise = directoryHandlesRestorePromise;

async function prepareLocalMusicSourceInBackground(source) {
  if (source !== 'local' && source !== 'extra') return false;

  if (sourcePreparationPromises[source]) {
    return sourcePreparationPromises[source];
  }

  sourcePreparationPromises[source] = (async function() {
    try {
      await directoryHandlesRestorePromise;

      const handle = sourceDirectoryHandles[source];
      if (!handle) return false;

      /* まず保存済みTableを即時復元する。 */
      await prepareLocalMusicSourceFromTable(source);

      let meta = sourceMusicTables[source]
        ? sourceMusicTables[source].meta
        : null;

      if (meta && meta.completed) {
        return musicReady;
      }

      const permission = await handle.queryPermission({ mode: 'read' });
      if (permission !== 'granted') {
        return musicReady;
      }

      await scanMusicTableInBackground(source, handle);
      buildSourceMusicStateFromTable(source);
      return musicReady;

    } catch (error) {
      console.log(`${source} のバックグラウンド準備をスキップしました:`, error);
      return false;

    } finally {
      sourcePreparationPromises[source] = null;
    }
  })();

  return sourcePreparationPromises[source];
}

async function openSourceDirectoryPicker(source, options) {
  try {
    return await window.showDirectoryPicker(options);
  } catch (error) {
    /* startInに保存Handleを指定できない場合だけ、startInなしで再試行 */
    if (options && options.startIn && error && error.name !== 'AbortError') {
      const retryOptions = { ...options };
      delete retryOptions.startIn;
      return await window.showDirectoryPicker(retryOptions);
    }
    throw error;
  }
}

async function chooseLocalMusicFolder(source, forcePicker = false, autoPlay = false, requestPermissionOnDemand = false) {
  if (source !== 'local' && source !== 'extra') return false;

  /*
     IndexedDBからLocal / ExternalのHandle復元が完了するまで待つ。
     これを待たずにソースを切り替えると、起動直後だけ
     「Handleが無い」と判定され、不要なフォルダーPickerが開く。
  */
  await directoryHandlesRestorePromise;

  const activeSource = musicSource;

  if (!window.showDirectoryPicker) {
    folderPickerMessage.innerHTML = 'このブラウザはフォルダー選択に対応していません。';
    return false;
  }

  /* 記憶済みHandleはPickerを開かず直接使用する */
  if (!forcePicker && sourceDirectoryHandles[source]) {
    try {
      if (activateLocalMusicCache(source)) {
        currentMusic = currentMusicBySource[source] || getSavedMusicForSource(source);
        const sourceFilesFound =
          source === musicSource
            ? musicFilesFound
            : (sourceMusicCaches[source] ? sourceMusicCaches[source].filesFound : new Set());
        if (!sourceFilesFound.has(currentMusic)) {
          currentMusic = Array.from(sourceFilesFound).sort((a, b) => a - b)[0] || 1;
        }
        saveMusicForSource(source, currentMusic);

        if (source === musicSource) {
          musicMode = 'none';
          hideFolderPickerDialog();
          showInitialButton();

          if (autoPlay) {
            musicMode = 'all';
            await playMusic(currentMusic, 'hint');
          }
        }
        return true;
      }

      const handle = sourceDirectoryHandles[source];
      let permission = await handle.queryPermission({ mode: 'read' });

      /*
         通常のバックグラウンド準備ではpermission promptを出さない。
         ソース切替え／My MUSIC再生のユーザー操作中だけ
         requestPermissionOnDemand=trueとしてrequestPermission()を行う。
      */
      if (permission !== 'granted' && requestPermissionOnDemand) {
        permission = await handle.requestPermission({ mode: 'read' });
      }

      /*
         Handleは記憶されているがpermissionがまだ取れていない場合、
         ここでPickerへフォールバックしない。
         フォルダー選択はLong-tapに限定する。
      */
      if (permission !== 'granted') {
        return false;
      }

      selectedMusicFolderName = handle.name || '';
      await prepareLocalMusicSourceFromTable(source);
      await scanMusicTableInBackground(source, handle);
      buildSourceMusicStateFromTable(source);
      const count = musicCount;
      if (count > 0) {
        currentMusic = currentMusicBySource[source] || getSavedMusicForSource(source);
        const sourceFilesFound =
          source === musicSource
            ? musicFilesFound
            : (sourceMusicCaches[source] ? sourceMusicCaches[source].filesFound : new Set());
        if (!sourceFilesFound.has(currentMusic)) {
          currentMusic = Array.from(sourceFilesFound).sort((a, b) => a - b)[0] || 1;
        }
        saveMusicForSource(source, currentMusic);

        if (source === musicSource) {
          musicMode = 'none';
          hideFolderPickerDialog();

          /*
             フォルダー読込み後は即再生しない。
             「My MUSIC再生」ボタンを押した時に再生する。
          */
          showInitialButton();

          if (autoPlay) {
            musicMode = 'all';
            await playMusic(currentMusic, 'hint');
          }
        }

        return true;
      }
    } catch (error) {
      console.log(`${source} の記憶フォルダーを直接使用できませんでした:`, error);
      return false;
    }

    /*
       記憶Handleが存在しても読み出せない場合、通常tapではPickerを出さない。
       Long-tapによるforcePicker=trueの場合だけ下のPickerへ進む。
    */
    if (!forcePicker) return false;
  }

  /* 初回、またはLong-tapによる「フォルダー変更」の場合だけPickerを開く */
  if (!forcePicker && !sourceDirectoryHandles[source]) {
    /* 初回のみ、呼出し元のUIでフォルダー選択を明示的に開始する */
  }

  try {
    const options = {
      mode: 'read',
      id: source === 'local' ? 'fukiya-music-local' : 'fukiya-music-extra'
    };

    /*
       Long-tapでフォルダー変更する場合、まずそのソースで
       前回選択したフォルダーをPickerの開始位置にする。
    */
    if (forcePicker && sourceDirectoryHandles[source]) {
      options.startIn = sourceDirectoryHandles[source];
    }

    folderPickerMessage.innerHTML = source === 'extra'
      ? 'External側を含むフォルダーを選択してください<br>SDメモリの場合は「≡」からExternalを選択してください'
      : '音楽フォルダーを選択してください';

    const isFolderChange = forcePicker && !!sourceDirectoryHandles[source];

    const directoryHandle = await openSourceDirectoryPicker(source, options);
    sourceDirectoryHandles[source] = directoryHandle;
    await saveDirectoryHandle(source, directoryHandle);
    selectedMusicFolderName = directoryHandle.name || '';

    /*
       フォルダー選択時に、同じソースのバックグラウンド走査が
       並行して動いている場合は、先にその完了を待つ。
       走査処理はグローバルな musicFileMap / musicFilesFound / musicCount を
       使用するため、旧フォルダーの走査と新フォルダーの走査を同時に行うと
       「音楽ファイルが見つかりませんでした」と誤判定することがある。
    */
    if (sourcePreparationPromises[source]) {
      await sourcePreparationPromises[source];
    }

    /* フォルダー変更時は、このソースの索引Tableだけを作り直す。 */
    await deleteMusicTableFromDB(source);

    await scanMusicTableInBackground(source, directoryHandle);
    buildSourceMusicStateFromTable(source);
    const count = musicCount;
    if (count === 0) {
      folderPickerMessage.innerHTML = `${sourceLabel(source)}で音楽ファイルが見つかりませんでした。<br>別のフォルダーを選択してください`;
      return false;
    }

    /*
       Long-tapによるフォルダー変更では、旧フォルダーの再生番号を引き継がない。
       新しいフォルダーの先頭曲 Music-1 から開始する。
       通常のソース切替えでは、この処理を行わない。
    */
    if (isFolderChange) {
      currentMusic = 1;
      saveMusicForSource(source, 1);

      /* フォルダー変更前の音楽が再生中なら、旧フォルダーの曲を停止する。 */
      if (source === musicSource) {
        music.pause();
        music.currentTime = 0;
        music.src = '';
        musicMode = 'none';
      }
    } else {
      currentMusic = currentMusicBySource[source] || getSavedMusicForSource(source);
    }

    const sourceFilesFound =
      source === musicSource
        ? musicFilesFound
        : (sourceMusicCaches[source] ? sourceMusicCaches[source].filesFound : new Set());
    if (!sourceFilesFound.has(currentMusic)) {
      currentMusic = Array.from(sourceFilesFound).sort((a, b) => a - b)[0] || 1;
    }
    saveMusicForSource(source, currentMusic);

    if (source === activeSource) {
      hideFolderPickerDialog();

      if (isFolderChange) {
        /* 新フォルダーのMusic-1を直ちに再生する。 */
        musicMode = 'all';
        await playMusic(currentMusic, 'immediate');
        return true;
      }

      musicMode = 'none';

      /*
         フォルダー選択後も即再生しない。
         「My MUSIC再生」ボタンを押した時に再生する。
      */
      showInitialButton();

      if (autoPlay) {
        musicMode = 'all';
        await playMusic(currentMusic, 'hint');
      }
    }

    return true;
  } catch (error) {
    if (error && error.name === 'AbortError') return false;
    console.log('フォルダー選択に失敗しました:', error);
    folderPickerMessage.innerHTML = 'フォルダーを選択できませんでした。<br>もう一度「フォルダーを選択」を押してください';
    return false;
  }
}

/* ========================================

/*
   音楽タイトルキャッシュ
   GitHub / Local / External を完全分離する。
   同じMusic-xx番号でも、ソースが違えば別タイトルとして保持する。
*/
const musicTitleCaches = {
  github: new Map(),
  local: new Map(),
  extra: new Map()
};

function getMusicTitleCache(source = musicSource) {
  return musicTitleCaches[source] || musicTitleCaches.github;
}

let musicTitleRequestId = 0;
const musicTitleDisplayDelay = 5;

/*
   曲目タイトルの表示方式
   true  ：Long-tap/左右フリック等で選曲したため即タイトル表示
   false ：起動直後／Music all playの曲頭5秒間は操作方法を表示
*/
let musicTitleImmediate = false;

/* ========================================
   Gemini-toolで実績のあるタイトル取得方式
   ----------------------------------------
   取得したMP3をBlob → FileReaderでArrayBuffer化し、
   生バイトからTIT2/TT2を検索する。
   音楽再生処理とは完全に独立。
   ======================================== */

function findBytes(haystack, needle) {
  for (let i = 0; i <= haystack.length - needle.length; i++) {
    let found = true;
    for (let j = 0; j < needle.length; j++) {
      if (haystack[i + j] !== needle[j]) {
        found = false;
        break;
      }
    }
    if (found) return i;
  }
  return -1;
}

function getMusicTitleFromBuffer(buffer) {
  const uint8 = new Uint8Array(buffer);
  const view = new DataView(buffer);

  /* ========================================
     MP3 / ID3v2
     ======================================== */
  if (
    uint8.length >= 10 &&
    uint8[0] === 0x49 &&
    uint8[1] === 0x44 &&
    uint8[2] === 0x33
  ) {
    /* Gemini-toolと同じく生バイトからTIT2/TT2を検索 */
    let index = findBytes(uint8, [0x54, 0x49, 0x54, 0x32]);
    let frameHeaderSize = 10;

    /* ID3v2.2 */
    if (index === -1) {
      index = findBytes(uint8, [0x54, 0x54, 0x32]);
      frameHeaderSize = 6;
    }

    if (index !== -1) {
      let frameSize;

      if (frameHeaderSize === 10) {
        frameSize =
          (view.getUint8(index + 4) << 24) |
          (view.getUint8(index + 5) << 16) |
          (view.getUint8(index + 6) << 8) |
          view.getUint8(index + 7);
      } else {
        frameSize =
          (view.getUint8(index + 3) << 16) |
          (view.getUint8(index + 4) << 8) |
          view.getUint8(index + 5);
      }

      if (frameSize > 1) {
        const textStart = index + frameHeaderSize;
        const textEnd = textStart + frameSize;

        if (textStart < uint8.length && textEnd <= uint8.length) {
          const encoding = uint8[textStart];
          const textBytes = uint8.slice(textStart + 1, textEnd);
          let title = '';

          try {
            if (encoding === 1 || encoding === 2) {
              title = new TextDecoder('utf-16').decode(textBytes);
            } else if (encoding === 3) {
              title = new TextDecoder('utf-8').decode(textBytes);
            } else {
              title = new TextDecoder('shift_jis').decode(textBytes);
            }
          } catch (error) {
            title = '';
          }

          title = title
            .replace(/\0/g, '')
            .replace(/[\x00-\x1F\x7F]/g, '')
            .trim();

          if (title) return title;
        }
      }
    }
  }

  /* ========================================
     FLAC / Vorbis Comment

     FLACのTITLEはVorbis Commentメタデータブロック
     (block type = 4) の KEY=VALUE 形式で格納される。
     ======================================== */
  let flacStart = -1;

  /* 通常のFLACは先頭がfLaC */
  if (
    uint8.length >= 4 &&
    uint8[0] === 0x66 &&
    uint8[1] === 0x4C &&
    uint8[2] === 0x61 &&
    uint8[3] === 0x43
  ) {
    flacStart = 0;
  } else {
    /* ID3v2が先頭に付くFLACにも対応 */
    flacStart = findBytes(uint8, [0x66, 0x4C, 0x61, 0x43]);
  }

  if (flacStart !== -1 && flacStart + 4 <= uint8.length) {
    let offset = flacStart + 4;

    while (offset + 4 <= uint8.length) {
      const blockHeader = view.getUint8(offset);
      const isLast = (blockHeader & 0x80) !== 0;
      const blockType = blockHeader & 0x7F;
      const blockSize =
        (view.getUint8(offset + 1) << 16) |
        (view.getUint8(offset + 2) << 8) |
        view.getUint8(offset + 3);

      offset += 4;

      if (offset + blockSize > uint8.length) break;

      if (blockType === 4 && blockSize >= 8) {
        let p = offset;

        /* vendor_length */
        const vendorLength = view.getUint32(p, true);
        p += 4;
        if (p + vendorLength > offset + blockSize) break;
        p += vendorLength;

        /* user_comment_list_length */
        if (p + 4 > offset + blockSize) break;
        const commentCount = view.getUint32(p, true);
        p += 4;

        for (let i = 0; i < commentCount; i++) {
          if (p + 4 > offset + blockSize) break;

          const commentLength = view.getUint32(p, true);
          p += 4;

          if (p + commentLength > offset + blockSize) break;

          try {
            const comment = new TextDecoder('utf-8').decode(
              uint8.slice(p, p + commentLength)
            );
            const equal = comment.indexOf('=');

            if (equal > 0) {
              const key = comment.slice(0, equal).trim().toUpperCase();
              if (key === 'TITLE') {
                const title = comment
                  .slice(equal + 1)
                  .replace(/\0/g, '')
                  .replace(/[\x00-\x1F\x7F]/g, '')
                  .trim();

                if (title) return title;
              }
            }
          } catch (error) {
            /* このコメントは読み飛ばして次を確認 */
          }

          p += commentLength;
        }
      }

      offset += blockSize;
      if (isLast) break;
    }
  }

  return '';
}
function readMusicTitleWithFileReader(blob) {
  return new Promise(function(resolve) {
    const reader = new FileReader();

    reader.onload = function() {
      try {
        resolve(getMusicTitleFromBuffer(reader.result) || '');
      } catch (error) {
        resolve('');
      }
    };

    reader.onerror = function() {
      resolve('');
    };

    try {
      reader.readAsArrayBuffer(blob);
    } catch (error) {
      resolve('');
    }
  });
}

async function fetchMusicTitle(number) {
  const titleCache = getMusicTitleCache();

  if (titleCache.has(number)) {
    return titleCache.get(number);
  }

  let file = getMusicFile(number);

  try {
    /*
       まず現在判明しているファイルを取得する。
       MP3なら従来通り即座にタイトル取得を試みる。
    */
    let response = await fetch(file, { cache: 'no-store' });

    /*
       MP3が存在しない場合だけ、他の対応拡張子を探す。
       これにより、FLAC等でもタイトル取得処理へ進める。
    */
    if (!response.ok) {
      const resolvedFile = await findMusicFile(number);
      if (!resolvedFile) return '';

      file = resolvedFile;
      response = await fetch(file, { cache: 'no-store' });
    }

    if (!response.ok) return '';

    const blob = await response.blob();
    const title = await readMusicTitleWithFileReader(blob);

    if (title) {
      titleCache.set(number, title);
    }

    return title;
  } catch (error) {
    console.log('音楽タイトル取得に失敗しました:', error);
    return '';
  }
}

function updateMusicTitleByTime() {
  if (musicMode === 'none' || !music.src) return;

  /*
     手動選曲／Long-tap／左右フリックでは

  */
  if (musicTitleImmediate) return;

  if (music.currentTime < musicTitleDisplayDelay) {
    if (!music.paused) {
      showMusicLongTapHint();
    }
    return;
  }

  /*
     timeupdateは再生中に何度も発生する。
     毎回showMusicTitle()を呼ぶとスクロール位置が

  */
  if (musicTitleShownFor === currentMusic) return;

  const title = getMusicTitleCache().get(currentMusic);
  showMusicTitle(title || '');
  musicTitleShownFor = currentMusic;

function prepareMusicTitle(number, requestId) {
  fetchMusicTitle(number).then(function(title) {
    if (requestId !== musicTitleRequestId) return;
    if (currentMusic !== number || musicMode === 'none') return;

    /*
       即タイトル表示モードでは、曲頭5秒を待たず
       タイトル取得完了直後に表示する。
       Pause中でも選曲直後なら表示する。
    */
    if (musicTitleImmediate) {
      if (musicTitleShownFor !== number) {
        showMusicTitle(title || '');
        musicTitleShownFor = number;
      }
      return;
    }

    /*
       起動直後／Music all playモードでは
       曲頭5秒間は操作方法を表示する。
    */
    if (!music.paused && music.currentTime >= musicTitleDisplayDelay) {
      if (musicTitleShownFor !== number) {
        showMusicTitle(title || '');
        musicTitleShownFor = number;
      }
    }
  });
}



/*
   再生モード

   none   ：停止
   all    ：全曲リピート
   single ：選択曲リピート
*/

let musicMode = 'none';


/*
   現在の曲番号
*/

let currentMusic = 1;


/*
   Long-tap関連
*/

let pressTimer = null;

let longTapTriggered = false;


/* ========================================
   音楽ファイル名
   ======================================== */

function getMusicFile(number) {

  if (musicSource !== 'github') {
    if (musicFileMap.has(number)) {
      return musicFileMap.get(number);
    }
    return '';
  }

  if (githubMusicFileMap.has(number)) {
    return githubMusicFileMap.get(number);
  }

  /* 前回検出した拡張子があれば、起動直後の先行ロードにも利用 */
  const savedExtension =
    localStorage.getItem(`fukiyaTestLastMusicExt-${number}`);

  if (musicExtensions.includes(savedExtension)) {
    return `@music-${number}.${savedExtension}`;
  }

  /* 従来通りMP3を最初に試す */
  return `@music-${number}.mp3`;
}


/*
   指定した音楽ファイルが実際に存在し、ブラウザで読み込めるか確認する。
*/
function probeMusicFile(file) {

  return new Promise((resolve) => {

    const testAudio = new Audio();
    let finished = false;

    const finish = (result) => {
      if (finished) return;
      finished = true;

      testAudio.removeEventListener('loadedmetadata', onSuccess);
      testAudio.removeEventListener('canplay', onSuccess);
      testAudio.removeEventListener('error', onError);

      testAudio.src = '';
      resolve(result);
    };

    const onSuccess = () => finish(true);
    const onError = () => finish(false);

    testAudio.preload = 'metadata';
    testAudio.addEventListener('loadedmetadata', onSuccess, { once: true });
    testAudio.addEventListener('canplay', onSuccess, { once: true });
    testAudio.addEventListener('error', onError, { once: true });
    testAudio.src = file;
    testAudio.load();

  });
}


/*
   @music-xx.* を実際の拡張子へ解決する。

   同じ番号に複数形式がある場合は
   MP3 → FLAC → M4A → AAC → OGG → OGA → OPUS → WAV → WEBM
   の順で最初に見つかったものを採用する。
*/
async function findMusicFile(number) {

  if (musicSource !== 'github') {
    return await getPlayableLocalMusicFile(number);
  }

  if (githubMusicFileMap.has(number)) {
    return githubMusicFileMap.get(number);
  }

  const savedExtension =
    localStorage.getItem(`fukiyaTestLastMusicExt-${number}`);

  const extensions = [];

  if (musicExtensions.includes(savedExtension)) {
    extensions.push(savedExtension);
  }

  musicExtensions.forEach(function(extension) {
    if (!extensions.includes(extension)) {
      extensions.push(extension);
    }
  });

  for (const extension of extensions) {

    const file = `@music-${number}.${extension}`;
    const exists = await probeMusicFile(file);

    if (exists) {
      githubMusicFileMap.set(number, file);
      localStorage.setItem(
        `fukiyaTestLastMusicExt-${number}`,
        extension
      );
      return file;
    }

  }

  return '';
}


/* ========================================
   音楽ファイル数を起動時に自動検出
   ======================================== */

async function detectMusicCount() {

  if (musicSource !== 'github') {
    /* Local / Extra はフォルダー選択時に検出済み */
    return musicCount;
  }

  musicCount = 0;
  musicFilesFound = new Set();
  githubMusicFileMap.clear();

  /*
     GitHub版はMusic-1～Music-20を対象とする。
     Local / Extraはフォルダー選択時に全曲を再帰取得するため、
     ここでは検出しない。
  */
  const maxProbe = 20;

  for (let i = 1; i <= maxProbe; i++) {

    const file = await findMusicFile(i);

    if (file) {
      musicFilesFound.add(i);
      musicCount = Math.max(musicCount, i);
    }

  }

  currentMusic = getSavedMusicForSource('github');
  currentMusicBySource.github = currentMusic;

  if (
    !Number.isInteger(currentMusic) ||
    currentMusic < 1 ||
    currentMusic > maxProbe ||
    !musicFilesFound.has(currentMusic)
  ) {
    currentMusic = 1;
    currentMusicBySource.github = 1;
  }

  return musicCount;
}


/* ========================================
   現在曲を保存
   ======================================== */

function saveMusicForSource(source, number) {

  currentMusicBySource[source] = number;

  localStorage.setItem(
    `fukiyaTestLastMusic_${source}`,

  );

  saveMusicForSource(musicSource, currentMusic);

}


/* ========================================
   音楽左右フリック
   有効範囲：音楽ボタンより上の既存領域全体
             ＋戻るボタン下方の固定エリア
   ======================================== */

const musicSwipeBottom =
  document.getElementById('musicSwipeBottom');

let swipeStartX = 0;
let swipeStartY = 0;
let swipeTracking = false;

const swipeMinX = 50;
const swipeMaxY = 80;

function musicSwipeStart(event) {

  /* 音楽再生中またはPause中だけ有効 */
  if (musicMode === 'none' || !music.src) {
    return;
  }

  swipeStartX = event.clientX;
  swipeStartY = event.clientY;
  swipeTracking = true;

}

async function musicSwipeEnd(event) {

  if (!swipeTracking) {
    return;
  }

  swipeTracking = false;

  const dx = event.clientX - swipeStartX;
  const dy = event.clientY - swipeStartY;

  /* 左右移動が小さい／上下移動が大きい場合は無視 */
  if (
    Math.abs(dx) < swipeMinX ||
    Math.abs(dy) > swipeMaxY
  ) {
    return;
  }

  /* MP3検出完了前は曲送りを行わない */
  if (!musicReady || musicFilesFound.size === 0) {
    return;
  }

  const available =
    Array.from(musicFilesFound)
      .sort((a, b) => a - b);

  if (available.length <= 1) {
    return;
  }

  let currentIndex =
    available.indexOf(currentMusic);

  if (currentIndex === -1) {
    currentIndex = 0;
  }

  /*
     右→左：次の曲
     左→右：前の曲
  */
  if (dx < 0) {
    currentIndex =
      (currentIndex + 1) % available.length;
  }
  else {
    currentIndex =
      (currentIndex - 1 + available.length) % available.length;
  }

  const nextMusic =
    available[currentIndex];

  /* フリック前の再生状態を保存 */
  const wasPaused = music.paused;

  /*
     Pause中なら再生を開始せず、曲だけ変更する。
     再生モードは musicMode のまま継続する。
  */
  if (wasPaused) {

    currentMusic = nextMusic;
    saveCurrentMusic();

    music.src =
      await findMusicFile(currentMusic);

    musicTitleShownFor = 0;
    musicTitleImmediate = true;

    const titleRequestId = ++musicTitleRequestId;
    const cachedTitle = getMusicTitleCache().get(currentMusic);
    if (cachedTitle !== undefined) {
      showMusicTitle(cachedTitle);
      musicTitleShownFor = currentMusic;
    } else {
      showMusicTitle('');
    }
    prepareMusicTitle(currentMusic, titleRequestId);

    music.load();

    showPausedButton();

  }
  else {

    await playMusic(nextMusic, 'immediate');

  }

}

function musicSwipeCancel() {
  swipeTracking = false;
}

/*
   音楽ボタンより上の既存領域全体をフリック可能にする。
   70pxの専用領域は追加しないため、元のGAPは変わらない。

});

/* ========================================
   音楽再生
   ======================================== */

async function playMusic(number, titleDisplayMode = 'auto') {

  /*
     再生番号の範囲

     GitHub：Music-1～Music-20
     Local / Extra：選択したフォルダー内で検出した全曲
  */
  const maxPlayableMusic =
    musicSource === 'github' ? 20 : musicCount;

  if (
    !Number.isInteger(number) ||
    number < 1 ||
    number > maxPlayableMusic
  ) {
    return;
  }

  /*
     Local / Externalでは、musicFileMapにURLがまだ無くても正常。
     Tableに保存された相対パスから、ここで実Fileを取得する。
     musicFileMapは再生済みFileのObject URLを保持するだけ。
  */

  /*
     音楽再生時は動画を停止。
     動画の再生位置はリセットする。
  */
  if (!video.paused) {
    video.pause();
    video.currentTime = 0;
    videoArea.style.display = 'none';
    videoButton.textContent = '癒やしの動画';
  }

  currentMusic = number;
  musicTitleShownFor = 0;

  /*
     titleDisplayMode
       'immediate'：手動選曲／Long-tap／左右フリック
       'hint'     ：起動直後／Music all play
       'auto'     ：musicModeに従う
  */
  musicTitleImmediate =
    titleDisplayMode === 'immediate' ||
    (titleDisplayMode === 'auto' && musicMode !== 'all');

  saveCurrentMusic();

  /*
     GitHubは、再生直前に実在するファイル形式まで解決する。
     検出済みMapをここで削除しない。
     これにより、Music-1がMP3以外（FLAC等）でも確実に
     検出済みの実ファイルをそのまま再生できる。
  */
  if (musicSource === 'github') {
    let resolvedGitHubFile = await findMusicFile(currentMusic);

    /*
       指定曲が存在しない場合は、Music-1～20から
       最初に存在する曲を探す。
       GitHub側で番号に欠番があっても再生開始できるようにする。
    */
    if (!resolvedGitHubFile) {
      for (let i = 1; i <= 20; i++) {
        resolvedGitHubFile = await findMusicFile(i);
        if (resolvedGitHubFile) {
          currentMusic = i;
          saveCurrentMusic();
          break;
        }
      }
    }

    if (!resolvedGitHubFile) {
      console.log('GitHub側に再生可能な音楽ファイルがありません');
      return;
    }

    music.src = resolvedGitHubFile;
  }
  else {
    /*
       再起動後のLocal / Externalでは、IndexedDBから復元した
       DirectoryHandleのpermissionが「prompt」に戻っている場合がある。

       TableにはFile本体を保存していないため、再生時に実Fileを取得する前に
       ユーザー操作中のrequestPermission()を行う。
       これを後段で行うと、getPlayableLocalMusicFile()が先に失敗して
       再生できない。
    */
    await directoryHandlesRestorePromise;

    const handle = sourceDirectoryHandles[musicSource];
    if (!handle) {
      console.log('Local / Externalの記憶済みフォルダーがありません');
      return;
    }

    try {
      let permission = await handle.queryPermission({ mode: 'read' });

      if (permission !== 'granted') {
        permission = await handle.requestPermission({ mode: 'read' });
      }

      if (permission !== 'granted') {
        console.log('Local / Externalの読み取り権限が取得できませんでした');
        return;
      }
    } catch (error) {
      console.log('Local / Externalの読み取り権限確認に失敗しました:', error);
      return;
    }

    const localFile = await getPlayableLocalMusicFile(currentMusic);
    if (!localFile) {
      console.log('Local / External側の実ファイルを取得できません:', currentMusic);
      return;
    }
    music.src = localFile;
  }

  /* タイトル取得は再生開始を待たせない */
  const titleRequestId = ++musicTitleRequestId;

  if (musicTitleImmediate) {
    /*
       キャッシュ済みなら即時に正式タイトルを表示。
       未取得ならタイトル取得完了時に即時表示する。
    */
    const cachedTitle = getMusicTitleCache().get(currentMusic);
    if (cachedTitle !== undefined) {
      showMusicTitle(cachedTitle);
      musicTitleShownFor = currentMusic;
    } else {
      showMusicTitle('');
    }
  }
  else {
    showMusicLongTapHint();
  }

  prepareMusicTitle(currentMusic, titleRequestId);

  music.load();

  try {

    await music.play();

    showPlayingButton();

    /*
       GitHub版のみ、実際に再生が開始された後で
       音楽ファイル存在確認をバックグラウンド開始する。
       Local / Extra はフォルダー選択時に検出済み。
    */
    if (musicSource === 'github') {
      startMusicDetection();
    }

  } catch (error) {

    /*
       まず @music-xx.mp3 以外の対応形式を探す。
       MP3が無く、FLAC/M4A/AAC等だけが存在する場合は
       ここで実ファイルへ切り替えて再生を再試行する。
    */
    const resolvedFile = await findMusicFile(currentMusic);

    if (resolvedFile && music.src !== new URL(resolvedFile, location.href).href) {
      music.src = resolvedFile;
      music.load();

      try {
        await music.play();
        showPlayingButton();
        if (musicSource === 'github') {
          startMusicDetection();
        }
        return;
      } catch (retryError) {
        console.log(
          '対応音声形式の再生にも失敗しました:',
          retryError
        );
      }
    }

    /*
       起動直後で前回曲の存在確認がまだ終わっておらず、
       前回曲が存在しなかった場合はMusic-1へ。
    */
    if (
      !musicReady &&
      currentMusic !== 1
    ) {
      currentMusic = 1;
      saveCurrentMusic();
      music.src = getMusicFile(1);
      music.load();

      try {
        await music.play();
        showPlayingButton();
        if (musicSource === 'github') {
          startMusicDetection();
        }
        return;
      } catch (retryError) {
        console.log(
          'Music-1も再生できませんでした:',
          retryError
        );
      }
    }

    console.log(
      '音楽を再生できませんでした:',
      error
    );

  }

}

async function resumeMusic() {

  /* 動画 → Musicでも完全排他にする */
  if (!video.paused) {

    videoArea.style.display = 'none';
    videoButton.textContent = '癒やしの動画';

      error
    );

}


/* ========================================
   音楽ボタン short-tap
   ======================================== */

musicButton.addEventListener(
  'pointerup',
  async function(event) {

    event.preventDefault();

    /*
       Long-tapでメニューを開いた直後のpointerupは
       short-tapとして処理しない。
    */
    if (longTapTriggered) {
      longTapTriggered = false;
      return;
    }

    /*
       プルダウン表示中のshort-tap
       → メニューだけ閉じる。
       再生／停止状態は変化させない。
    */
    if (musicMenu.style.display === 'block') {
      musicMenu.style.display = 'none';
      return;
    }

    /*
       Local / External

       短tapではフォルダーPickerを表示しない。
       ただし、再起動後はIndexedDBからHandleが復元されていても
       permissionが「prompt」へ戻る場合があるため、
       実際のファイルアクセスはこの「My MUSIC再生」tap中に行う。

       これが重要な理由：
       requestPermission()にはユーザー操作が必要であり、
       ラジオ切替え時に先回りして要求すると、
       Local / Externalを選ぶだけでpermission確認が表示される。

       同一セッション中に既に索引Tableがある場合は、
       permission要求もフォルダー再走査も行わない。
    */
    if (musicSource !== 'github') {

      await musicTablesRestorePromise;

      /*
         Local / Externalでは、現在ソースの索引Tableが読み込まれていない限り
         My MUSIC再生前に必ず記憶Handleから準備する。
         「musicFilesFoundに何か残っているか」だけでは判定しない。
      */
      const activeCache = sourceMusicCaches[musicSource];
      const activeCacheReady =
        !!(activeCache && activeCache.ready && activeCache.filesFound.size > 0);

      if (!activeCacheReady) {

        /*
           Ver.11q：保存済み索引Table復元後、ソース選択後に先行準備が進行中なら、まずその完了を待つ。
           既にpermissionがgrantedなら、この待機中に走査が完了するため、
           My MUSIC再生時の初回待ち時間を短縮できる。
        */
        if (sourcePreparationPromises[musicSource]) {
          await sourcePreparationPromises[musicSource];
        }

        const preparedCache = sourceMusicCaches[musicSource];
        if (preparedCache && preparedCache.ready && preparedCache.filesFound.size > 0) {
          activateLocalMusicCache(musicSource);
        }

        const refreshedActiveCache = sourceMusicCaches[musicSource];
        const refreshedReady =
          !!(refreshedActiveCache && refreshedActiveCache.ready && refreshedActiveCache.filesFound.size > 0);

        if (refreshedReady) {
          currentMusic = currentMusicBySource[musicSource] || getSavedMusicForSource(musicSource);
          if (!musicFilesFound.has(currentMusic)) {
            currentMusic = Array.from(musicFilesFound).sort((a, b) => a - b)[0] || 1;
          }
          saveMusicForSource(musicSource, currentMusic);
        }

        /*
           記憶Handleがある場合だけ、ユーザー操作中に
           permission確認→フォルダー再読込みを行う。
           Pickerは開かない。
        */
        if (!refreshedReady && sourceDirectoryHandles[musicSource]) {
          const prepared = await chooseLocalMusicFolder(
            musicSource,
            false,
            false,
            true
          );

          if (!prepared || musicFilesFound.size === 0) {
            return;
          }
        }
        else if (!refreshedReady) {
          /*
             初回などHandleが無い場合。
             フォルダー選択はLong-tapに限定するため、
             short-tapではPickerを出さず終了する。
          */
          return;
        }
      }
    }

    /* 再生中 → Pause */
    if (!music.paused) {
      music.pause();
      showPausedButton();
      return;
    }

    /* Pause状態 → 続きから再生 */
    if (musicMode !== 'none' && music.src) {
      await resumeMusic();
      return;
    }

    /* 完全停止状態 → Music all play開始 */
    musicMode = 'all';

    /* GitHubもLocal / Externalと同じく、保存済みの前回曲を使用する */
    if (musicSource === 'github' && !music.src) {
      currentMusic = getSavedMusicForSource('github');
      currentMusicBySource.github = currentMusic;
    }

    await playMusic(currentMusic);
  }
);

      'musicOption';

    const table = musicSource !== 'github'

    const record = table ? table.records.get(i) : null;

    option.textContent =
      musicSource === 'github'
        ? `Music-${i}`
        : getDisplayMusicId(record);

    option.dataset.value =
      String(i);

    musicMenu.appendChild(
      option
    );

  }

}


/* ========================================
   現在曲表示を更新
   ======================================== */

function updateMusicMenuHighlight() {

  const options =
    musicMenu.querySelectorAll('.musicOption');

  options.forEach(function(option) {

    option.classList.remove('currentMusic');

    if (
      option.dataset.value !== 'all' &&
      Number(option.dataset.value) === currentMusic &&
      musicMode !== 'none'
    ) {
      option.classList.add('currentMusic');
    }

  });

}


/* ========================================
   音楽メニュー表示
   ======================================== */

function showMusicMenu() {

  /* 検出完了前は表示しない */
  if (!musicReady) {
    return;
  }

  updateMusicMenuHighlight();

  /*
     先に表示してメニュー上端を取得する。
     機種によって異なる画面高さ／ナビゲーション領域に
     合わせて、表示可能な高さだけを確保する。
     これによりF-51Bでも検出された全曲を
     スクロールして表示できる。
  */
  musicMenu.style.display =
    'block';

  const menuRect =
    musicMenu.getBoundingClientRect();

  const viewportHeight =
    window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

  const bottomMargin = 8;

  const availableHeight =
    Math.floor(
      viewportHeight -
      menuRect.top -
      bottomMargin
    );

  if (availableHeight > 0) {
    musicMenu.style.maxHeight =
      `${availableHeight}px`;
  }

}


/* ========================================
   音楽メニュー選択
   ======================================== */

musicMenu.addEventListener(
  'click',
  async function(event) {

    const option =
      event.target.closest('.musicOption');

    if (!option) {

      return;

    }

    const value =
      option.dataset.value;


    /*
       Music all play
    */

    if (value === 'all') {

      musicMode = 'all';

      /*
         現在曲から全曲再生
      */

      await playMusic(currentMusic);

    }


    /*
       個別曲
    */

    else {

      const number =
        Number(value);

      if (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= musicCount &&
        musicFilesFound.has(number)
      ) {

        musicMode = 'single';

        await playMusic(number);

      }

    }


    /*
       選曲後はメニューを閉じる。
    */

    musicMenu.style.display =
      'none';

  }
);


/* ========================================
   プルダウン以外をtapしたら閉じる
   ======================================== */

document.addEventListener(
  'pointerdown',
  function(event) {

    if (
      musicMenu.style.display === 'block' &&
      !musicControl.contains(event.target)
    ) {
      musicMenu.style.display = 'none';
    }

  }
);


/* ========================================
   音楽終了
   ======================================== */

music.addEventListener(
  'ended',
  async function() {


    /*
       完全停止状態
    */

    if (musicMode === 'none') {

      showInitialButton();

      return;

    }


    /*
       個別曲
       → 同じ曲をリピート
    */

    if (musicMode === 'single') {

      await playMusic(currentMusic);

      return;

    }


    /*
       全曲再生
       → 次の曲
    */

    if (musicMode === 'all') {

      const available =
        Array.from(musicFilesFound)
          .sort((a, b) => a - b);

      if (available.length === 0) {
        return;
      }

      const currentIndex =
        available.indexOf(currentMusic);

      if (currentIndex === -1) {
        currentMusic = available[0];
      }
      else {
        currentMusic =
          available[
            (currentIndex + 1) %
            available.length
          ];
      }

      await playMusic(currentMusic);

    }

  }
);


/* ========================================
   音楽初期表示
   ======================================== */

/*
   起動直後の音楽再生を最優先する。

   音楽ファイル存在確認は起動時には開始しない。
   初回再生用ファイルの読み込みを他の検出処理と競合させないため、
   最初の再生開始後にバックグラウンドで検出する。
*/
let musicDetectionStarted = false;
let musicDetectionGeneration = 0;

function startMusicDetection() {

  if (musicSource !== 'github') return;
  if (musicDetectionStarted) return;
  musicDetectionStarted = true;

  const generation = ++musicDetectionGeneration;
  const detectionSource = musicSource;

  detectMusicCount()
    .then(function() {
      /* 古いGitHub検出処理の結果は破棄する */
      if (generation !== musicDetectionGeneration) return;
      if (musicSource !== detectionSource) return;

      createMusicMenu();
      musicReady = true;

      if (
        music.paused &&
        musicMode === 'none'
      ) {
        showInitialButton();
      }
    })
    .catch(function(error) {
      if (generation !== musicDetectionGeneration) return;
      if (musicSource !== detectionSource) return;

      console.log(
        '音楽ファイル検出中にエラーが発生しました:',
        error
      );

      musicReady = true;
      createMusicMenu();
    });
}

async function initializeMusic() {

  /*
     起動時は音楽ボタンを即使用可能にする。
     音楽ファイル存在確認はまだ開始しない。
  */
  showInitialButton();
}

/*
   起動時の選曲は検出完了を待たずに決定する。
   ①前回再生していた音楽ファイル
   ②①が無ければMusic-1
   前回情報がなければMusic-1。
*/
(function loadInitialMusicSelection() {

  currentMusic = getSavedMusicForSource('github');
  currentMusicBySource.github = currentMusic;

  if (
    !Number.isInteger(currentMusic) ||
    currentMusic < 1 ||
    currentMusic > 20
  ) {
    currentMusic = 1;
    currentMusicBySource.github = 1;
  }

  showInitialButton();

  /* ========================================
     初回再生の遅延対策

     前回曲（またはMusic-1）を起動直後から
     音声要素へセットして先行ロードする。
     前回検出済みの拡張子があれば、それを優先する。
     音声形式の存在確認完了は待たない。
     ======================================== */
  music.preload = 'auto';
  music.src = getMusicFile(currentMusic);
  music.load();

})();

initializeMusic();

/* 5秒後のタイトル表示 */
music.addEventListener('timeupdate', updateMusicTitleByTime);


/* ========================================
   壁紙
   ======================================== */

/* @wallpaper-1.jpg ～ @wallpaper-20.jpg
   番号に歯抜けがあっても対応する。 */
const maxWallpaperProbe = 20;
const wallpaperNumber = document.getElementById('wallpaperNumber');
let wallpaperNumbers = [];
const wallpaperFiles = {};
const wallpaperImages = {};
let currentWallpaper = 1;

function showWallpaperNumber(number) {
  wallpaperNumber.textContent = `by Ken.Ishida　- ${String(number).padStart(2, '0')} -`;
}

function detectWallpaperFiles() {
  const probes = [];
  for (let i = 1; i <= maxWallpaperProbe; i++) {
    probes.push(new Promise(function(resolve) {
      const image = new Image();
      const file = `@wallpaper-${i}.jpg`;
      image.onload = function() {
        resolve(image.naturalWidth > 0 ? {number:i, image:image} : null);
      };
      image.onerror = function() { resolve(null); };
      image.src = file;
    }));
  }
  return Promise.all(probes);
}

const wallpaperLayerA =
  document.getElementById('wallpaperLayerA');

const wallpaperLayerB =
  document.getElementById('wallpaperLayerB');

let activeWallpaperLayer = wallpaperLayerA;

/*
   次の壁紙を非表示側レイヤーへ先にセットする。
   既にImageとして読み込み済みの壁紙だけを使用する。
*/
function applyWallpaper(number) {
  if (!wallpaperImages[number]) return;

  const nextLayer =
    activeWallpaperLayer === wallpaperLayerA
      ? wallpaperLayerB
      : wallpaperLayerA;

  const file = wallpaperFiles[number];

  /*
     次の壁紙を非表示側レイヤーへセットする。
     まず旧壁紙を1秒でフェイドアウト。
  */
  nextLayer.style.backgroundImage =
    `url('${file}')`;

  nextLayer.style.opacity = '0';
  activeWallpaperLayer.style.transition =
    'opacity 1s linear';
  activeWallpaperLayer.style.opacity = '0';

  /*
     Black表示時間は最小値。
     フェイドアウト完了直後、次の壁紙を
     1秒でフェイドインする。
  */
  setTimeout(function() {
    nextLayer.style.transition =
      'opacity 1s linear';
    nextLayer.style.opacity = '1';
    activeWallpaperLayer = nextLayer;
  }, 1000);
}

async function initializeWallpaper() {
  const results = await detectWallpaperFiles();
  wallpaperNumbers = [];

  results.forEach(function(result) {
    if (!result) return;
    const number = result.number;
    wallpaperNumbers.push(number);
    wallpaperFiles[number] = `@wallpaper-${number}.jpg`;
    wallpaperImages[number] = result.image;
  });

  wallpaperNumbers.sort(function(a,b) { return a-b; });
  if (wallpaperNumbers.length === 0) return;

  const savedNumber = Number(localStorage.getItem('fukiyaTestLastWallpaper'));
  if (Number.isInteger(savedNumber) && wallpaperNumbers.includes(savedNumber)) {
    currentWallpaper = savedNumber;
  } else {
    currentWallpaper = wallpaperNumbers[0];
  }

  wallpaperLayerA.style.transition = 'none';
  wallpaperLayerB.style.transition = 'none';
  wallpaperLayerA.style.backgroundImage =
    `url('${wallpaperFiles[currentWallpaper]}')`;
  wallpaperLayerA.style.opacity = '1';
  wallpaperLayerB.style.opacity = '0';
  activeWallpaperLayer = wallpaperLayerA;

  showWallpaperNumber(currentWallpaper);
}

function changeWallpaper() {
  if (wallpaperNumbers.length === 0) return;

  const currentIndex = wallpaperNumbers.indexOf(currentWallpaper);
  const nextIndex =
    currentIndex === -1
      ? 0
      : (currentIndex + 1) % wallpaperNumbers.length;

  const nextWallpaper = wallpaperNumbers[nextIndex];
  const nextImage = wallpaperImages[nextWallpaper];

  if (!nextImage || !nextImage.complete || nextImage.naturalWidth === 0) return;

  currentWallpaper = nextWallpaper;

  applyWallpaper(currentWallpaper);

  showWallpaperNumber(currentWallpaper);
  localStorage.setItem(
    'fukiyaTestLastWallpaper',
    String(currentWallpaper)
  );
}

initializeWallpaper();

/* 5秒ごと（テスト用） */
setInterval(changeWallpaper, 15000);


/* ========================================
   癒やしの動画
   ======================================== */

const video =
  document.getElementById('relaxVideo');

const videoButton =
  document.getElementById('videoButton');

const videoArea =
  document.getElementById('videoArea');


/*
   動画ボタン

   ① ボタンtap
      小窓を表示して再生。

   ② 小窓の動画tap
      フルスクリーンへ。

   ③ フルスクリーン中の動画tap
      フルスクリーンを解除して小窓へ戻る。
*/

videoButton.addEventListener(
  'click',
  async function() {

    if (video.paused) {

      /*
         動画開始時は音楽を自動停止。
         再生位置は保持し、動画終了後も自動再開しない。
      */
      if (!music.paused) {
        music.pause();
        showPausedButton();
      }

      videoArea.style.display =
        'block';

      try {

        await video.play();

        videoButton.textContent =
          '動画停止';

      } catch (error) {

        console.log(
          '動画を再生できませんでした:',
          error
        );

      }

    }

    else {

      video.pause();

      video.currentTime = 0;

      videoArea.style.display =
        'none';

      videoButton.textContent =
        '癒やしの動画';

    }

  }
);


/*
   動画tap
   小窓 ⇔ フルスクリーン
*/
video.addEventListener(
  'click',
  async function() {

    /*
       フルスクリーン中
       → フルスクリーン解除
    */
    if (
      document.fullscreenElement === video ||
      document.webkitFullscreenElement === video
    ) {

      try {

        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }

        else if (
          document.webkitExitFullscreen
        ) {
          document.webkitExitFullscreen();
        }

      } catch (error) {

        console.log(
          'フルスクリーン解除に失敗しました:',
          error
        );

      }

      return;
    }


    /*
       小窓表示中
       → フルスクリーン
    */

    try {

      if (video.requestFullscreen) {
        await video.requestFullscreen();
      }

      else if (
        video.webkitEnterFullscreen
      ) {
        /*
           iPhone Safari用。
           Safariのvideo fullscreenへ移行。
        */
        video.webkitEnterFullscreen();
      }

    } catch (error) {

      console.log(
        'フルスクリーン表示に失敗しました:',
        error
      );

    }

  }
);


/*
   フルスクリーン解除後

   小窓表示を維持。
   再生はそのまま継続する。
*/
document.addEventListener(
  'fullscreenchange',
  function() {

    if (!document.fullscreenElement) {

      if (!video.paused) {

        videoArea.style.display =
          'block';

        videoButton.textContent =
          '動画停止';

      }

    }

  }
);


/*
   動画終了時
*/
video.addEventListener(
  'ended',
  function() {

    /*
       動画終了時はフルスクリーンも明示的に終了する
    */
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitFullscreenElement) {
      if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } else if (video.webkitDisplayingFullscreen) {
      if (video.webkitExitFullscreen) {
        video.webkitExitFullscreen();
      }
    }

    videoButton.textContent =
      '癒やしの動画';

    videoArea.style.display =
      'none';

  }
);


/* ========================================
   開発用 IndexedDB 完全初期化

   ・走査中はボタン自体を無効化する。
   ・停止中に実行するとDB全体を削除し、
     handles / localTable / externalTable の両方を完全に初期化する。
   ・削除完了後にページを再読込し、メモリ上の
     フォルダー記憶／Local・Externalの索引Tableも同時に初期状態へ戻す。
   ======================================== */
const indexedDBResetButton =
  document.getElementById('indexedDBResetButton');

async function resetIndexedDBCompletely() {

  if (musicScanInProgress > 0) {
    alert('フォルダー走査中のため、IndexedDB完全初期化は実行できません。\n走査完了後にもう一度実行してください。');
    return;
  }

  const confirmed = confirm(
    'IndexedDBを完全初期化します。\n\n' +
    'Local / External の選択フォルダー記憶と\n' +
    '保存済み音楽索引Tableがすべて削除されます。\n\n' +
    '実行しますか？'
  );

  if (!confirmed) return;

  indexedDBResetButton.disabled = true;

  try {
    await new Promise(function(resolve, reject) {
      const request =
        indexedDB.deleteDatabase(directoryHandleDBName);

      request.onsuccess = function() {
        resolve();
      };

      request.onerror = function() {
        reject(request.error);
      };

      request.onblocked = function() {
        reject(new Error('IndexedDBの削除が別の処理によって保留されています。'));
      };
    });

    alert('IndexedDBを完全初期化しました。\nページを再読み込みします。');
    location.reload();

  } catch (error) {

    console.error('IndexedDB完全初期化に失敗しました:', error);
    alert('IndexedDB完全初期化に失敗しました。\nコンソールを確認してください。');
    updateIndexedDBResetButtonState();
  }
}

indexedDBResetButton.addEventListener(
  'click',
  resetIndexedDBCompletely
);

updateIndexedDBResetButtonState();

/* ========================================
   Ver.45 アドレスバー スクロールアウト対応

   アドレスバー収納中はスクロールを許可し、
   収納処理が完了してからscrollY=1へ戻す。
   Ver.44の常時1px固定による早過ぎる制限を解消する。
   ======================================== */
let addressBarClampEnabled = false;
let addressBarClampTimer = null;

function beginAddressBarScrollOut() {
  addressBarClampEnabled = false;
  if (addressBarClampTimer !== null) {
    clearTimeout(addressBarClampTimer);
    addressBarClampTimer = null;
  }
}

function finishAddressBarScrollOut() {
  if (addressBarClampTimer !== null) {
    clearTimeout(addressBarClampTimer);
  }
  addressBarClampTimer = setTimeout(function() {
    addressBarClampEnabled = true;
    if (window.scrollY > 1) {
      window.scrollTo(0, 1);
    }
  }, 300);
}

function limitAddressBarScroll() {
  if (addressBarClampEnabled && window.scrollY > 1) {
    window.scrollTo(0, 1);
  }
}

const addressBarSpacer = document.getElementById('addressBarSpacer');

if (addressBarSpacer) {
  addressBarSpacer.addEventListener('touchstart', beginAddressBarScrollOut, { passive: true });
  addressBarSpacer.addEventListener('touchend', finishAddressBarScrollOut, { passive: true });
  addressBarSpacer.addEventListener('touchcancel', finishAddressBarScrollOut, { passive: true });
  addressBarSpacer.addEventListener('pointerdown', beginAddressBarScrollOut);
  addressBarSpacer.addEventListener('pointerup', finishAddressBarScrollOut);
  addressBarSpacer.addEventListener('pointercancel', finishAddressBarScrollOut);
}

window.addEventListener('scroll', limitAddressBarScroll, { passive: true });

window.addEventListener('resize', function() {
  addressBarClampEnabled = false;
});

window.addEventListener('orientationchange', function() {
  addressBarClampEnabled = false;
  setTimeout(function() {
    if (window.scrollY > 1) window.scrollTo(0, 1);
  }, 500);
});

window.addEventListener('load', function() {
  addressBarClampEnabled = false;
  window.scrollTo(0, 0);
});

window.addEventListener('resize', syncMusicHintWidth);
window.addEventListener('orientationchange', syncMusicHintWidth);
syncMusicHintWidth();

</script>
