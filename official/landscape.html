<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Official Landscape ver.02.1 by Ken.Ishida</title>

<style>

html{
    min-height:calc(100vh + 600px);
    overflow-y:auto;
    overflow-x:hidden;
}

body{
    margin:0;
    min-height:calc(100vh + 600px);
    background:#000;
    color:#fff;

    /* 画面全体をページ本体のスクロールとしてChromeへ伝える */
    overflow:visible;

/* -----  テキスト選択を禁止  ----- */
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

/* =====================
   メイン
===================== */

#main{

    /* ページをスクロールしてもタイマー画面は上端に留める */
    position:sticky;
    top:0;
    width:100vw;
    height:92vh;

    display:grid;

    grid-template-columns:
        75%
        25%;
}

/* PCのみ少し広げる */
@media (min-width: 1000px){

    #main{
        grid-template-columns:
            80%
            20%;
    }

}

/* =====================
   左パネル
===================== */

#leftPanel{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
    isolation:isolate;
    background-color:#000;
    background-image:none;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    touch-action:pan-y;
}

/* アナログ時計の位置・サイズ調整はこの設定だけを変更 */
#clockWallpaperUnit{
    --clock-offset-x:-17vw;
    --clock-offset-y:0vh;
    --clock-diameter:min(70vw,70vh);
    --clock-hit-size:clamp(52px,10vh,100px);
    position:absolute;
    inset:0;
    pointer-events:none;
}

#wallpaperClockLayer{
    display:none;
    position:absolute;
    left:calc(50% + var(--clock-offset-x));
    top:calc(50% + var(--clock-offset-y));
    transform:translate(-50%,-50%);
    width:var(--clock-diameter);
    height:var(--clock-diameter);
    z-index:0;
    pointer-events:none;
}

#wallpaperClockLayer svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
}
#clockLongPressTarget{
    display:none;
    position:absolute;
    left:calc(50% + var(--clock-offset-x));
    top:calc(50% + var(--clock-offset-y));
    transform:translate(-50%,-50%);
    z-index:4;
    width:var(--clock-hit-size);
    height:var(--clock-hit-size);
    padding:0;
    border:0;
    border-radius:50%;
    outline:none;
    background:transparent;
    color:transparent;
    touch-action:none;
    pointer-events:auto;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
}
#leftPanel.clockForeground #wallpaperClockLayer{
    z-index:3;
}



#title,
#timerArea{
    position:relative;
    z-index:1;
}

/* =====================
   タイトル
===================== */

#title{
    width:100%;
    height:8vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

#wallpaperNum{position:absolute;right:10px;top:calc(50% + 1.2em);transform:translateY(-50%);color:#ffe45c;font-size:clamp(14px,2.5vw,28px);font-weight:900;text-shadow:0 1px 3px #000;z-index:2;}
#wallpaperLibrary{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:rgba(0,0,0,.86);}
#wallpaperLibrary.open{display:flex;}
#wallpaperLibraryPanel{width:min(92%,560px);max-height:100%;overflow-y:auto;padding:12px;box-sizing:border-box;border:2px solid #ffe45c;border-radius:12px;background:rgba(12,12,12,.97);}
#wallpaperLibraryHeading{margin:0 0 12px;color:#ffe45c;text-align:center;font-size:clamp(20px,2.4vw,32px);}
.wallpaperLibraryRow{display:flex;align-items:stretch;gap:8px;margin:7px 0;}
.wallpaperLibraryItem{flex:1;min-width:0;width:100%;min-height:52px;margin:0;padding:10px 12px;border:1px solid rgba(255,255,255,.45);border-radius:6px;color:#fff;background:#222;text-align:left;font-size:clamp(20px,2.1vw,30px);line-height:1.2;overflow-wrap:anywhere;cursor:pointer;}
.wallpaperLibraryItem:active{background:#484848;}
.wallpaperDeleteBtn{min-width:82px;padding:8px 10px;border:1px solid #ffaaaa;border-radius:6px;color:#fff;background:#7a2020;font-size:clamp(18px,1.8vw,24px);font-weight:bold;cursor:pointer;}
.wallpaperDeleteBtn:active{background:#a33;}
#wallpaperLibraryClose{width:100%;min-height:48px;margin-top:10px;padding:8px;border:1px solid #aaa;border-radius:6px;color:#fff;background:#444;font-size:clamp(18px,1.8vw,24px);cursor:pointer;}
#title h1{
    margin:0;
    color:white;
    font-size:clamp(
        18px,
        2vw,
        42px
    );
    font-weight:bold;
}

#titleMain{
    color:#ffffaa;
    font-size:1.15em;
    font-weight:bold;
}

#titleAuthor{
    color:white;
    font-size:1em;
}

/* =====================
   タイマーエリア
===================== */

#timerArea{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

#time{
    font-family:"MS PGothic","MS Pゴシック",monospace;
    color:#ffd700;
    font-weight:900;
    font-size:min(
        40vw,
        60vh
    );
    line-height:.85;
    letter-spacing:-0.01em;
    transform:scaleY(1.3);
    text-shadow:
        0 1px 0 #fff6b0,
        0 2px 0 #ffe97a,
        0 3px 0 #ffd700,
        0 4px 0 #e0b800,
        0 5px 0 #c89d00,
        0 6px 0 #9a7600,
        0 12px 25px rgba(0,0,0,.90),
        0 0 25px rgba(255,215,0,.35);
}

/* 通常点滅 */
@keyframes blink { 0%,50%,100% { opacity: 1; } 25%,75% { opacity: 0; } }
.blink { animation: blink 1.0s infinite; }

/* 高速点滅 */
@keyframes fastBlink { 0%,50%,100% { opacity: 1; } 25%,75% { opacity: 0; } }
.fast-blink { animation: fastBlink 0.6s infinite; }

/* pulse（ゆらぎ：1回） */

@keyframes pulse {

    0% {
        transform:scale(1.3);
        text-shadow:0 0 10px rgba(255,255,255,0.8);
    }

    50% {
        transform:scale(1.55);
        text-shadow:0 0 30px rgba(255,255,255,1);
    }

    100% {
        transform:scale(1.3);
        text-shadow:0 0 10px rgba(255,255,255,0.8);
    }
}

.pulse{
    animation:pulse 0.5s ease-in-out 1;
}

/* =====================
   右パネル
===================== */

#rightPanel{

    border-left:
        2px solid white;

    display:grid;

    grid-template-rows:
        20%
        20%
        20%
        20%
        20%;
}

/* =====================
   ラウンド表示
===================== */

#roundLabel{

    display:flex;

    justify-content:center;
    align-items:center;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    color:#ffe45c;

    font-weight:900;

    font-size:
        clamp(
            24px,
            2vw,
            48px
        );

    border-bottom:
        2px solid white;

    text-shadow:
        0 0 10px rgba(255,215,0,.6);

    cursor:pointer;
}

/* =====================
   ラウンド巨大表示
===================== */
#roundOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);/* 不透明度85% */
  color:#00ff00;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:min(95vw,95vh);
  font-weight:bold;
  z-index:99999;
  pointer-events:none;
}

@keyframes roundPulse{
  0%{
    transform:scale(1);
  }
  45%{
    transform:scale(1.35);
  }
  100%{
    transform:scale(1);
  }
}

.roundPulse{
  display:inline-block;
  animation:
    roundPulse
    0.8s
    cubic-bezier(.2,1.7,.4,1)
    1;
}

/* =====================
   ボタン共通
===================== */

.ctrlBtn{

    width:90%;
    height:75%;

    margin:auto;

    border:none;

    border-radius:20px;

    cursor:pointer;

    font-weight:bold;

    font-size:
        clamp(
            22px,
            2vw,
            42px
        );

    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.5),
        inset 0 -4px 8px rgba(0,0,0,.35),
        0 6px 12px rgba(0,0,0,.8);

    transition:.1s;
}

.ctrlBtn:active{

    transform:
        translateY(4px);

    box-shadow:
        inset 0 5px 10px rgba(0,0,0,.6);
}

/* =====================
   開始
===================== */

#startBtn{

    background:
        linear-gradient(
            #8cff00,
            #008000,
            #006400
        );

    color:white;
}

#startBtn.locked{

    box-shadow:
        inset 0 6px 12px rgba(0,0,0,.55);

    transform:
        translateY(3px);
}

/* =====================
   撥ね矢 OFF
===================== */

#bounceBtn{

    background:
        linear-gradient(
            #cfcfcf,
            #a0a0a0,
            #707070
        );

    color:black;
}

#bounceBtn.on{

    background:
        linear-gradient(
            #ffff66,
            #ffd700,
            #c09000
        );

    color:red;
}

#bounceBtn.locked{

    transform:translateY(3px);

    box-shadow:
        inset 0 6px 12px rgba(0,0,0,.55);
}

/* =====================
   解除
===================== */

#resetBtn{

    background:
        linear-gradient(
            #ff8888,
            #ff0000,
            #880000
        );

    color:white;
}

/* =====================
   筒清掃指示 ON
===================== */

#cleanBtn{

    background:
        linear-gradient(
            #00ff00,
            #00cc00,
            #008000
        );

    color:black;
}

#cleanBtn.off{

    background:
        linear-gradient(
            #cfcfcf,
            #a0a0a0,
            #707070
        );

    color:black;
}

#cleanBtn.locked{
    transform:translateY(3px);
    box-shadow:
        inset 0 6px 12px rgba(0,0,0,.55);
}

/* =====================
   起動時オーバレイ
===================== */
#startupOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999999;
}
/* 南京錠 */
#startupBtn{
    position:relative;
    font-size:120px;
    user-select:none;
    cursor:pointer;
    -webkit-tap-highlight-color:
        transparent;
    transition:
        transform 1.2s ease,
        opacity 1.2s ease;
}

#startupBtn img{
    width: 130px;    /* Portrait/Landscape共通サイズ */
    height:auto;
    display:block;
    user-select:none;
    pointer-events:none;
}

#tapMeText{
    position:absolute;
    left:50%;
    top:84%;
    transform:
        translate(-50%,-50%);
    color:lime;
    font-family:Arial Black,Impact,sans-serif;
    font-weight:bold;
    font-size:32px;   /* Portrait/Landscape共通サイズ */
    white-space:nowrap;
    text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
    pointer-events:none;
    z-index:10;
}

/* 解錠アニメ */
#startupBtn.unlock{
    transform:scale(2.5);
    opacity:0;
}

/* 解錠中アニメ */
@keyframes lockShake{
    0%{
        transform:rotate(0deg);
    }
    20%{
        transform:rotate(-5deg);
    }
    40%{
        transform:rotate(5deg);
    }
    60%{
        transform:rotate(-5deg);
    }
    80%{
        transform:rotate(5deg);
    }
    100%{
        transform:rotate(0deg);
    }
}

.unlocking{
    animation:
        lockShake
        0.5s
        infinite;
}

</style>
</head>

<body>
<!-- 起動時オーバレイ -->
<div id="startupOverlay">
  <div id="startupBtn">
    <img
      id="startupImg"
      src="key_lock.png"
      alt="lock"
    >
    <div id="tapMeText">
      Please tap me !
    </div>
  </div>
</div>

<div id="main">

    <div id="leftPanel">

        <div id="clockWallpaperUnit">
            <div id="wallpaperClockLayer" aria-hidden="true"></div>
            <button id="clockLongPressTarget" type="button" aria-label="アナログ時計を前後に切替" tabindex="-1"></button>
        </div>
        <input id="wallpaperFiles" type="file" accept="image/*,.jpg,.jpeg,.gif" style="display:none">
        <div id="wallpaperLibrary" role="dialog" aria-modal="true" aria-label="壁紙庫">
            <div id="wallpaperLibraryPanel">
                <h2 id="wallpaperLibraryHeading">壁紙庫</h2>
                <div id="wallpaperLibraryItems"></div>
                <button id="wallpaperLibraryClose" type="button">閉じる</button>
            </div>
        </div>

        <div id="title">
            <h1>
                <span id="titleMain">
                    《 Official Landscape ver.02.1 》
                </span>
                <span id="titleAuthor">
                    ～ by Ken.Ishida ～
                </span>
            </h1>
            <div id="wallpaperNum" aria-live="polite"></div>

</div>

        <div id="timerArea">

            <div id="time">
                3:00
            </div>

        </div>

    </div>

    <div id="rightPanel">

        <div id="roundLabel">
            練習ラウンド
        </div>

        <button
            id="startBtn"
            class="ctrlBtn">
            開　始
        </button>

        <button
            id="bounceBtn"
            class="ctrlBtn">
            撥ね矢
        </button>

        <button
            id="resetBtn"
            class="ctrlBtn">
            解　除
        </button>

        <button
            id="cleanBtn"
            class="ctrlBtn">
            筒清掃指示
        </button>

    </div>

</div>

<audio id="audioStart0" src="start-0.mp3" preload="auto"></audio>
<audio id="audioStart1" src="start-1.mp3" preload="auto"></audio>
<audio id="audioStart2" src="start-2.mp3" preload="auto"></audio>
<audio id="audioStart3" src="start-3.mp3" preload="auto"></audio>
<audio id="audioStart4" src="start-4.mp3" preload="auto"></audio>
<audio id="audioStart5" src="start-5.mp3" preload="auto"></audio>
<audio id="audioStart6" src="start-6.mp3" preload="auto"></audio>
<audio id="audioWhistleStart" src="whistle_start.mp3" preload="auto"></audio>
<audio id="audio30" src="30sec.mp3" preload="auto"></audio>
<audio id="audioEnd" src="end.mp3" preload="auto"></audio>
<audio id="audioEndHaneya" src="end_haneya.mp3" preload="auto"></audio>
<audio id="audioEndTandoku" src="end_tandoku.mp3" preload="auto"></audio>
<audio id="audioClean" src="clean.mp3" preload="auto"></audio>

<script>

/* ===== Ver.01 Step1 ===== */
const audio30 = document.getElementById("audio30");
const audioEnd = document.getElementById("audioEnd");
const audioEndHaneya = document.getElementById("audioEndHaneya");
const audioEndTandoku = document.getElementById("audioEndTandoku");
const audioClean = document.getElementById("audioClean");
const audioStart0 = document.getElementById("audioStart0");
const audioStart1 = document.getElementById("audioStart1");
const audioStart2 = document.getElementById("audioStart2");
const audioStart3 = document.getElementById("audioStart3");
const audioStart4 = document.getElementById("audioStart4");
const audioStart5 = document.getElementById("audioStart5");
const audioStart6 = document.getElementById("audioStart6");
const audioWhistleStart = document.getElementById("audioWhistleStart");
// whistle_start.mp3 個別音量調整（100％＝原音）
const WHISTLE_START_VOLUME = 0.5;

const startAudios = [
    audioStart0,
    audioStart1,
    audioStart2,
    audioStart3,
    audioStart4,
    audioStart5,
    audioStart6
];

function updateStartButtonReady(){
    const audioStart =
        startAudios[roundIndex];
    if(audioStart.readyState >= 4){
        startBtn.classList.remove(
            "audioNotReady"
        );
        startBtn.classList.remove(
            "locked"
        );
    }else{
        startBtn.classList.add(
            "audioNotReady"
        );
        startBtn.classList.add(
            "locked"
        );
        audioStart.addEventListener(
            "canplaythrough",
            ()=>{
                startBtn.classList.remove(
                    "audioNotReady"
                );
                startBtn.classList.remove(
                    "locked"
                );
            },
            { once:true }
        );
    }
}

const timeDiv = document.getElementById("time");
const startBtn  = document.getElementById("startBtn");
const resetBtn  = document.getElementById("resetBtn");
const bounceBtn = document.getElementById("bounceBtn");
const cleanBtn  = document.getElementById("cleanBtn");

const rounds = [
  "練習ラウンド",
  "第１ラウンド",
  "第２ラウンド",
  "第３ラウンド",
  "第４ラウンド",
  "第５ラウンド",
  "最終ラウンド"
];
let roundIndex = 0;
const roundLabel =
    document.getElementById("roundLabel");

let timer = null;
let remaining = 180;
let started = false;
let cleanOn = true;
let bounceOn = false;
let pulseFired = {
    p305:false,
    p300:false,
    p030:false,
    p010:false
    };
let currentAudioStart = null;
let audioStartTimeout = null;
let iosAudioUnlocked = false;
let audioUnlockBusy = false;    //追加；260710
let startupUnlocked = false;    //追加；260713
let wakeLock = null;
let startTimerTimeout = null;

async function enableWakeLock(){
    try{
        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );
    }catch(e){
        console.log(
            "WakeLock取得失敗"
        );
    }
}

function disableWakeLock(){
    if(wakeLock){
        wakeLock.release();
        wakeLock = null;
    }
}

async function unlockIosAudio(){
  if(iosAudioUnlocked) return;
  audioUnlockBusy = true;
  const list = [
    audioEnd,           //2.3秒
    audioEndTandoku,    //1.0秒
    audioClean,         //2.1秒
    audio30             //1.5秒
  ];
  const jobs = list.map(async a=>{
    if(!a) return;
    try{
      a.currentTime = 0;
      a.muted = true;
      await new Promise(
        async (resolve,reject)=>{
          const endedHandler = ()=>{
            a.removeEventListener(
              'ended',
              endedHandler
            );
            resolve();
          };
          a.addEventListener(
            'ended',
            endedHandler,
            { once:true }
          );
          try{
            const p = a.play();
            if(p){
              await p;
            }
          }catch(e){
            reject(e);
          }
        }
      );
      a.pause();
      a.currentTime = 0;
      a.muted = false;
    }catch(e){
      console.error(
        'unlock error:',
        a?.id,
        e
      );
      throw e;
    }
  });
  await Promise.all(jobs);
  iosAudioUnlocked = true;
  audioUnlockBusy = false;
}

function doPulse(){
    timeDiv.classList.remove("pulse");
    void timeDiv.offsetWidth;
    timeDiv.classList.add("pulse");
}

function warmupSpeech(){
    try{
        if(!("speechSynthesis" in window)){
            return;
        }
        const msg =
            new SpeechSynthesisUtterance(
                "あ"
            );
        msg.volume = 0;
        msg.lang = "ja-JP";
        speechSynthesis.speak(msg);
    }catch(e){}
}

/* 表示更新 */
function updateRoundLabel(){
    roundLabel.textContent =
        rounds[roundIndex];
}

/* ===== ラウンド番号巨大表示 ===== */
function showRoundOverlay(num){
    const overlay =
        document.getElementById(
            "roundOverlay"
        );
    overlay.innerHTML =
        `<span class="roundPulse">${num}</span>`;
    overlay.style.display = "flex";
    setTimeout(()=>{
        overlay.style.display =
            "none";
    },1000);
}

function updateDisplay(){
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    timeDiv.textContent =
        `${m}:${s.toString().padStart(2,"0")}`;
    timeDiv.classList.remove(
        "pulse",
        "blink",
        "fast-blink"
    );

    /* 3:05 */
    if(started && remaining === 185){
        timeDiv.style.color = "#00ff00";
        if(!pulseFired.p305){
            pulseFired.p305 = true;
            doPulse();
        }
        return;
    }

    /* 3:04～3:01 */
    if(started && remaining >= 181){
        timeDiv.style.color = "#00ff00";
        return;
    }

    /* 3:00 */
    if(started && remaining === 180){
        timeDiv.style.color = "#ffd700";
        if(!pulseFired.p300){
            pulseFired.p300 = true;
            doPulse();
        }
        return;
    }

    /* 2:59～0:31 */
    if(remaining >= 31){
        timeDiv.style.color = "#ffd700";
        return;
    }

    /* 0:30 */
    if(started && remaining === 30){
        timeDiv.style.color = "#ff0000";
        if(!pulseFired.p030){
            pulseFired.p030 = true;
            doPulse();
        }
        return;
    }

    /* 0:29～0:11 */
    if(remaining >= 11){
        timeDiv.style.color = "#ff0000";
        return;
    }

    /* 0:10 */
    if(started && remaining === 10){
        timeDiv.style.color = "#ff0000";
        if(!pulseFired.p010){
            pulseFired.p010 = true;
            doPulse();
        }
        return;
    }

    /* 0:09～0:01 */
    if(remaining >= 1){
        timeDiv.style.color = "#ff0000";
        timeDiv.classList.add("blink");
        return;
    }

    /* 0:00 */
    timeDiv.style.color = "#00ff00";
    timeDiv.classList.add("fast-blink");
}

function updateCleanButton(){

    if(cleanOn){

        cleanBtn.classList.remove("off");
        cleanBtn.classList.add("locked");

    }else{

        cleanBtn.classList.add("off");
        cleanBtn.classList.remove("locked");
    }
}

function updateBounceButton(){

    if(bounceOn){

        if(!started && remaining === 0){

            bounceBtn.textContent = "⬇撥ね矢有";

        }else{

            bounceBtn.textContent = "撥ね矢有";
        }

/* 壁紙：Portrait版のアナログ時計とIndexedDB保存をLandscapeの左パネルへ適用 */
const leftPanel = document.getElementById('leftPanel');
const clockWallpaperLayer = document.getElementById('wallpaperClockLayer');
const clockLongPressTarget = document.getElementById('clockLongPressTarget');

const wallpaperLibrary = document.getElementById('wallpaperLibrary');
const wallpaperLibraryItems = document.getElementById('wallpaperLibraryItems');
const wallpaperLibraryClose = document.getElementById('wallpaperLibraryClose');
const wallpaperNumEl = document.getElementById('wallpaperNum');
const wallpaperDbName = 'FukiyaTimerWallpaperDB';
const wallpaperDbStore = 'wallpapers';
const wallpaperSlots = [2,3,4,5,6,7,8,9,10];
let wallpapers = [{type:'clock', number:1}];
let wallpaperIndex = 0;
let wallpaperOn = false;
let clockWallpaperTimer = null;
let clockLongPressTimer = null;
let clockLongPressStart = null;
let clockLongPressConsumed = false;
let clockForeground = false;
let wallpaperTapTimer = null;

let wallpaperPointerStart = null;
let pendingWallpaperSlot = null;
const wallpaperUrlBySlot = {};

function wallpaperInteractionAllowed(){
    return !started && !timer && !startTimerTimeout && remaining === 180;
}

function openWallpaperDb(){
    return new Promise((resolve,reject)=>{
        if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
        const request = indexedDB.open(wallpaperDbName,1);
        request.onupgradeneeded = ()=>{
            const db = request.result;
            if(!db.objectStoreNames.contains(wallpaperDbStore)) db.createObjectStore(wallpaperDbStore);
        };
        request.onsuccess = ()=>resolve(request.result);
        request.onerror = ()=>reject(request.error);
    });
}

async function getStoredWallpaper(slot){
    const db = await openWallpaperDb();
    const result = await new Promise((resolve,reject)=>{
        const request = db.transaction(wallpaperDbStore,'readonly').objectStore(wallpaperDbStore).get(`landscape-${slot}`);
        request.onsuccess = ()=>resolve(request.result || null);
        request.onerror = ()=>reject(request.error);
    });
    db.close();
    return result;
}

async function storeWallpaper(slot,file,filename=file.name || ''){
    const db = await openWallpaperDb();
    await new Promise((resolve,reject)=>{
        const record={blob:file,filename:filename,type:file.type || ''};
        const request = db.transaction(wallpaperDbStore,'readwrite').objectStore(wallpaperDbStore).put(record,`landscape-${slot}`);
        request.onsuccess = ()=>resolve();
        request.onerror = ()=>reject(request.error);
    });
    db.close();
}

async function deleteStoredWallpaper(slot){
    const db = await openWallpaperDb();
    await new Promise((resolve,reject)=>{
        const request=db.transaction(wallpaperDbStore,'readwrite').objectStore(wallpaperDbStore).delete(`landscape-${slot}`);
        request.onsuccess=()=>resolve();
        request.onerror=()=>reject(request.error);
    });
    db.close();
}

function addWallpaperSlot(slot,blob,filename=''){
    if(wallpaperUrlBySlot[slot]) URL.revokeObjectURL(wallpaperUrlBySlot[slot]);
    const url = URL.createObjectURL(blob);
    wallpaperUrlBySlot[slot] = url;
    wallpapers = wallpapers.filter(item=>item.number !== slot);
    wallpapers.push({type:'image',number:slot,src:url,filename:filename || blob.name || 'ファイル名不明（再選択で更新）'});
    wallpapers.sort((a,b)=>a.number-b.number);
}
async function loadLandscapeWallpapers(){
    for(const slot of wallpaperSlots){
        try{
            const stored = await getStoredWallpaper(slot);
            if(stored){
                const isRecord = stored.blob instanceof Blob;
                const blob = isRecord ? stored.blob : stored;
                const filename = isRecord ? stored.filename : (stored.name || '');
                addWallpaperSlot(slot,blob,filename);
                if(!isRecord && filename) storeWallpaper(slot,blob,filename).catch(error=>console.warn('Wallpaper name migration failed:',error));
            }
        }catch(error){ console.warn('Wallpaper load failed:',error); }
    }
    try{
        const savedIndex = Number(localStorage.getItem('landscapeWallpaperIndex'));
        if(Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < wallpapers.length) wallpaperIndex = savedIndex;
        wallpaperOn = localStorage.getItem('landscapeWallpaperOn') === 'true';
    }catch(error){}
    applyLandscapeWallpaper();
}

let landscapeClockHands=null;

function buildLandscapeClockFace(){
    let ticks='';
    for(let i=0;i<60;i++){
        const a=(i*6-90)*Math.PI/180;
        const r1=i%5===0?430:440, r2=455;
        const x1=500+Math.cos(a)*r1, y1=500+Math.sin(a)*r1;
        const x2=500+Math.cos(a)*r2, y2=500+Math.sin(a)*r2;
        ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#00ff00" stroke-width="${i%5===0?12:5}" stroke-linecap="round"/>`;
    }
    let numbers='';
    for(let i=1;i<=12;i++){
        const a=(i*30-90)*Math.PI/180;
        const x=500+Math.cos(a)*375, y=500+Math.sin(a)*375;
        numbers+=`<text x="${x}" y="${y}" fill="#00ff00" font-size="80" font-family="Arial,sans-serif" text-anchor="middle" dominant-baseline="central">${i}</text>`;
    }
    clockWallpaperLayer.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" aria-hidden="true"><circle cx="500" cy="500" r="490" fill="none"/>${ticks}${numbers}<line id="clockHourHand" x1="500" y1="500" x2="500" y2="240" stroke="#00ff00" stroke-width="28" stroke-linecap="round"/><line id="clockMinuteHand" x1="500" y1="500" x2="500" y2="110" stroke="#00ff00" stroke-width="18" stroke-linecap="round"/><circle cx="500" cy="500" r="23" fill="#00ff00"/><line id="clockSecondHand" x1="500" y1="640" x2="500" y2="80" stroke="#ff2020" stroke-width="8" stroke-linecap="round"/><circle cx="500" cy="500" r="15" fill="#ff2020"/></svg>`;
    landscapeClockHands={
        hour:clockWallpaperLayer.querySelector('#clockHourHand'),
        minute:clockWallpaperLayer.querySelector('#clockMinuteHand'),
        second:clockWallpaperLayer.querySelector('#clockSecondHand')
    };
}

function stopLandscapeClock(){
    if(clockWallpaperTimer){ clearInterval(clockWallpaperTimer); clockWallpaperTimer=null; }
    clockWallpaperLayer.style.display='none';
}

function drawLandscapeClock(){
    if(!wallpaperOn || wallpapers[wallpaperIndex]?.type !== 'clock') return;
    if(!landscapeClockHands) buildLandscapeClockFace();
    const now=new Date();
    const secondAngle=now.getSeconds()*6;
    const minuteAngle=(now.getMinutes()+now.getSeconds()/60)*6;
    const hourAngle=((now.getHours()%12)+now.getMinutes()/60)*30;
    landscapeClockHands.hour.setAttribute('transform',`rotate(${hourAngle} 500 500)`);
    landscapeClockHands.minute.setAttribute('transform',`rotate(${minuteAngle} 500 500)`);
    landscapeClockHands.second.setAttribute('transform',`rotate(${secondAngle} 500 500)`);
    clockWallpaperLayer.style.display='block';
}
function updateWallpaperNumber(){
    const item=wallpapers[wallpaperIndex];
    wallpaperNumEl.textContent=wallpaperOn && item ? `-${String(item.number).padStart(2,'0')}-` : '';
}

function setClockForeground(enabled){
    clockForeground=enabled;
    leftPanel.classList.toggle('clockForeground',enabled);
}

function syncClockLongPressTarget(){
    const activeClock=wallpaperOn && wallpapers[wallpaperIndex]?.type==='clock';
    clockLongPressTarget.style.display=activeClock?'block':'none';
    if(!activeClock) setClockForeground(false);
}

function applyLandscapeWallpaper(){
    stopLandscapeClock();
    syncClockLongPressTarget();
    leftPanel.style.backgroundImage='none';
    updateWallpaperNumber();
    if(!wallpaperOn){
        leftPanel.style.backgroundColor='#000';
        return;
    }
    const item=wallpapers[wallpaperIndex];
    if(!item) return;
    if(item.type==='clock'){
        leftPanel.style.backgroundColor='#000';
        drawLandscapeClock();
        clockWallpaperTimer=setInterval(drawLandscapeClock,1000);
    }else{
        leftPanel.style.backgroundColor='';
        leftPanel.style.backgroundImage=`url("${item.src}")`;
    }
}

function cancelClockLongPress(){
    if(clockLongPressTimer){ clearTimeout(clockLongPressTimer); clockLongPressTimer=null; }
    clockLongPressStart=null;
}

function beginClockLongPress(x,y){
    if(wallpapers[wallpaperIndex]?.type!=='clock' || !wallpaperOn) return;
    if(clockLongPressTimer) clearTimeout(clockLongPressTimer);
    clockLongPressConsumed=false;
    clockLongPressStart={x,y};
    clockLongPressTimer=setTimeout(()=>{
        clockLongPressTimer=null;
        clockLongPressConsumed=true;
        setClockForeground(!clockForeground);
    },550);
}

function moveClockLongPress(x,y){
    if(!clockLongPressStart) return;
    if(Math.hypot(x-clockLongPressStart.x,y-clockLongPressStart.y)>18) cancelClockLongPress();
}

clockLongPressTarget.addEventListener('click',event=>{
    if(clockLongPressConsumed){
        event.preventDefault();
        event.stopPropagation();
        clockLongPressConsumed=false;
        return;
    }
    if(started){
        event.preventDefault();
        event.stopPropagation();
        suppressTimerClickUntil=Date.now()+700;
        handleEarlyEnd();
    }
});
clockLongPressTarget.addEventListener('contextmenu',event=>event.preventDefault());

if(window.PointerEvent){
    clockLongPressTarget.addEventListener('pointerdown',event=>{
        if(!event.isPrimary || (event.pointerType==='mouse' && event.button!==0)) return;
        beginClockLongPress(event.clientX,event.clientY);
    });
    clockLongPressTarget.addEventListener('pointermove',event=>moveClockLongPress(event.clientX,event.clientY));
    clockLongPressTarget.addEventListener('pointerup',cancelClockLongPress);
    clockLongPressTarget.addEventListener('pointercancel',cancelClockLongPress);
}else{
    clockLongPressTarget.addEventListener('touchstart',event=>{
        const touch=event.touches[0];
        if(touch) beginClockLongPress(touch.clientX,touch.clientY);
    },{passive:true});
    clockLongPressTarget.addEventListener('touchmove',event=>{
        const touch=event.touches[0];
        if(touch) moveClockLongPress(touch.clientX,touch.clientY);
    },{passive:true});
    clockLongPressTarget.addEventListener('touchend',cancelClockLongPress,{passive:true});
    clockLongPressTarget.addEventListener('touchcancel',cancelClockLongPress,{passive:true});
}
function refreshWallpaperLibrary(){

    clockButton.type='button';

async function deleteWallpaperSlot(slot){
    const selectedNumber=wallpapers[wallpaperIndex]?.number || 1;
    try{
        await deleteStoredWallpaper(slot);
        if(wallpaperUrlBySlot[slot]){
            URL.revokeObjectURL(wallpaperUrlBySlot[slot]);
            delete wallpaperUrlBySlot[slot];
        }
        wallpapers=wallpapers.filter(item=>item.number!==slot);
        if(selectedNumber===slot){
            wallpaperIndex=0;
        }else{
            const retainedIndex=wallpapers.findIndex(item=>item.number===selectedNumber);
            wallpaperIndex=retainedIndex>=0?retainedIndex:0;
        }
        try{localStorage.setItem('landscapeWallpaperIndex',String(wallpaperIndex));}catch(error){}
        applyLandscapeWallpaper();
        refreshWallpaperLibrary();
    }catch(error){
        console.error('Wallpaper delete failed:',error);
        alert('壁紙を削除できませんでした。');
    }
}

}

async function addSelectedWallpapers(){
    const file=wallpaperFiles.files && wallpaperFiles.files[0];

        alert('画像ファイルを選択してください。');
        return;

    try{
        await storeWallpaper(slot,file,file.name);
        addWallpaperSlot(slot,file,file.name);
        wallpaperIndex=wallpapers.findIndex(item=>item.number===slot);
        wallpaperOn=true;
        try{
            localStorage.setItem('landscapeWallpaperOn','true');
            localStorage.setItem('landscapeWallpaperIndex',String(wallpaperIndex));
        }catch(error){}
        applyLandscapeWallpaper();
    }catch(error){
        console.error('Wallpaper save failed:',error);
        alert('壁紙画像の保存に失敗しました。');
    }
}

/* ===== end_haneya専用アンロック(26/07/12) ===== */
if(bounceOn){
    try{
        if(audioEndHaneya){
            audioEndHaneya.muted = true;
            audioEndHaneya.currentTime = 0;
            audioEndHaneya.play().catch(()=>{});
            setTimeout(()=>{
                try{
                    audioEndHaneya.pause();
                    audioEndHaneya.currentTime = 0;
                    audioEndHaneya.muted = false;
                }catch(e){}
            },100);
        }
    }catch(e){

        );

}
    updateBounceButton();
});

let roundPressTimer = null;
let roundLongPress = false;
let roundMenuEl = null;

function handleRoundShortTap(){
    if(started) return;
    roundIndex++;
    if(roundIndex >= rounds.length){
        roundIndex = 0;
    }
    updateRoundLabel();
    updateStartButtonReady();
}

function closeRoundMenu(){
    if(!roundMenuEl) return;
    roundMenuEl.remove();
    roundMenuEl = null;
    document.removeEventListener(
        "click",
        outsideClose
    );
}

function outsideClose(e){
    if(
        e.target === roundLabel ||
        roundLabel.contains(e.target)
    ){
        return;
    }
    if(
        roundMenuEl &&
        !roundMenuEl.contains(e.target)
    ){
        closeRoundMenu();
    }
}

function showRoundMenu(){
    if(roundMenuEl) return;
    const rect =
        roundLabel.getBoundingClientRect();
    roundMenuEl =
        document.createElement("div");
    roundMenuEl.style.position = "fixed";
    roundMenuEl.style.left = "50%";
    roundMenuEl.style.transform =
        "translateX(-50%)";
    roundMenuEl.style.top =
        rect.bottom + "px";
    roundMenuEl.style.width = "70vw";
    roundMenuEl.style.maxWidth = "95vw";
    roundMenuEl.style.background = "#111";
    roundMenuEl.style.border =
        "1px solid #888";
    roundMenuEl.style.zIndex = "9999";
    roundMenuEl.style.maxHeight =
        "70vh";
    roundMenuEl.style.overflowY =
        "auto";
    rounds.forEach((r,i)=>{
        const item =
            document.createElement("div");
        item.textContent = r;
        item.style.padding =
            "8px 12px";
        item.style.fontSize =
            "20px";
        item.style.cursor =
            "pointer";
        item.style.userSelect =
            "none";
        if(i === roundIndex){
            item.style.background =
                "#333";
            item.style.color =
                "#00ff00";
        }
        item.addEventListener(
            "click",
            ()=>{
                if(started) return;
                roundIndex = i;
                updateRoundLabel();
                updateStartButtonReady();
                closeRoundMenu();
            }
        );
        roundMenuEl.appendChild(item);
    });
    document.body.appendChild(
        roundMenuEl
    );
    setTimeout(()=>{
        document.addEventListener(
            "click",
            outsideClose
        );
    },100);
}

/* ラウンド切替 */

roundLabel.addEventListener(
    "pointerdown",
    ()=>{
        if(started) return;
        if(remaining === 0) return;
        roundLongPress = false;
        roundPressTimer =
            setTimeout(()=>{
                roundLongPress = true;
                showRoundMenu();
            },500);
    }
);

roundLabel.addEventListener(
    "pointerup",
    ()=>{
        clearTimeout(
            roundPressTimer
        );
        if(!roundLongPress){
            handleRoundShortTap();
        }
    }
);

roundLabel.addEventListener(
    "pointerleave",
    ()=>{
        clearTimeout(
            roundPressTimer
        );
    }
);

// Bluetooth Keyboard対応
document.addEventListener('keydown',(e)=>{
if(!startupUnlocked){return;}
    const key = e.key;
    const now = Date.now();
    /* 長押し連打ガード */
    if(e.repeat){
        return;
    }
    if(
        key === lastKey &&
        now - lastKeyTime < 750
    ){
        return;
    }
    lastKey = key;
    lastKeyTime = now;

    /* Space / Enter */
    if(
        key === ' ' ||
        e.code === 'Space' ||
        e.code === 'Enter'
    ){
        e.preventDefault();
        if(
            !started &&
            remaining >= 180
        ){
            startBtn.click();
        }else if(
            started &&
            remaining > 0
        ){
            bounceBtn.click();
        }else if(
            !started &&
            remaining === 0
        ){
            resetBtn.click();
        }
        return;
    }

    switch(key){

        /* 開始 */
        case 's':
        case 'S':
            startBtn.click();
            break;

        /* 撥ね矢 */
        case 'b':
        case 'B':
        case 'h':
        case 'H':
            bounceBtn.click();
            break;

        /* 筒清掃指示 */
        case 'c':
        case 'C':
            cleanBtn.click();
            break;

        /* 解除 */
        case 'r':
        case 'R':
        case 'e':
        case 'E':
            resetBtn.click();
            break;

        /* 強制終了 */
        case 't':
        case 'T':
        case 'x':
        case 'X':
        case 'z':
        case 'Z':

            if(started){
                handleEarlyEnd();
            }
            break;
    }

    /* ラウンド直接選択 */
    if(/^[0-6]$/.test(key)){
        if(
            started ||
            remaining === 0
        ){
            return;
        }
        roundIndex = Number(key);
        updateRoundLabel();
        updateStartButtonReady();
        showRoundOverlay(key);
    }

    /* 現ラウンド表示 */
    if(
        key === 'n' ||
        key === 'N'
    ){
        if(
            typeof showRoundOverlay ===
            "function"
        ){
            showRoundOverlay(
                roundIndex
            );
        }
    }

});

const startupOverlay =
    document.getElementById(
        "startupOverlay"
    );
const startupBtn =
    document.getElementById(
        "startupBtn"
    );

async function unlockStartup(){
  document.getElementById(
    "tapMeText"
  ).style.display = "none";
  warmupSpeech();
  startupBtn.classList.add(
    'unlocking'
  );
  const startTime =
    performance.now();
  await unlockIosAudio();
  const elapsed =
    performance.now() -
    startTime;
  const minTime = 1500;
  if(elapsed < minTime){
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          minTime - elapsed
        )
    );
  }
  startupBtn.classList.remove(
    'unlocking'
  );
  document.getElementById(
    'startupImg'
  ).src = 'key_unlock.png';
  startupUnlocked = true;
  setTimeout(()=>{
    startupBtn.classList.add(
      'unlock'
    );
  },100);
  setTimeout(()=>{
    startupOverlay.style.display =
      'none';
  },1200);
}

/* 南京錠tap */
startupBtn.addEventListener(
  'click',
  unlockStartup
);

/* K/B any key */
document.addEventListener(
  'keydown',
  () => {
    if(!startupUnlocked){
      unlockStartup();
    }
  }
);
